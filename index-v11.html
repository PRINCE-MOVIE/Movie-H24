<!DOCTYPE html>
<html lang="fr">
<head>

<title>PRINCE MOVIE — Films, Séries & Animés en streaming</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><defs><linearGradient id='g' x1='10%25' y1='0%25' x2='90%25' y2='100%25'><stop offset='0%25' stop-color='%23e0102a'/><stop offset='55%25' stop-color='%236e0a17'/><stop offset='100%25' stop-color='%231c0306'/></linearGradient></defs><rect width='200' height='200' rx='46' fill='url(%23g)'/><rect x='58' y='46' width='24' height='128' rx='10' fill='%23e8bf6f'/><path d='M82,50 L148,88 L82,126 Z' fill='%23e8bf6f'/></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0a0a; --bg-2: #171717; --card: #1e1e1e;
  --accent: #e50914; --accent-2: #6b0710;
  --text: #f2f2f2; --text-muted: #9b9b9b;
}
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; }
header { background: var(--bg); padding: 16px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; transition: background-color .3s ease, border-color .3s ease; }
header.transparent-header { background: linear-gradient(180deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,0) 100%); border-bottom-color: transparent; }
.logo { display: inline-flex; align-items: center; gap: 9px; font-size: 24px; font-weight: 900; letter-spacing: 1.5px; color: #fff; cursor: pointer; text-decoration: none; background: none; border: none; }
.logo-mark { flex-shrink: 0; }
nav { display: flex; gap: 16px; flex-wrap: wrap; }
nav a { color: var(--text-muted); text-decoration: none; font-weight: 600; padding: 6px 12px; border-radius: 6px; transition: .2s; }
nav a:hover, nav a.active { color: var(--accent); background: rgba(229, 9, 20, 0.1); }
.search-box { margin-left: auto; display: flex; gap: 8px; }
.search-box input { background: var(--bg-2); border: 1px solid #333; color: var(--text); padding: 8px 14px; border-radius: 6px; outline: none; width: 220px; }
.search-box input:focus { border-color: var(--accent); }
.search-box button { background: var(--accent); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; }
main { padding: 24px; max-width: 1400px; margin: 0 auto; }
h1.section-title { font-size: 24px; margin-bottom: 20px; border-left: 4px solid var(--accent); padding-left: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; }
.card { background: var(--card); border-radius: 10px; overflow: hidden; cursor: pointer; transition: .25s; position: relative; text-decoration: none; color: inherit; }
.card:hover { transform: translateY(-5px); box-shadow: 0 8px 24px rgba(226,38,28,.25); }
.card img { width: 100%; height: 240px; object-fit: cover; display: block; background: #222; }
.card .info { padding: 10px; }
.card .info strong { display: block; font-size: 14px; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-ep-tag { position: absolute; right: 8px; bottom: 8px; z-index: 4; font-size: 10px; padding: 2px 8px; }
.has-chips { padding-top: 14px; }
.chip-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 14px; margin-bottom: 8px; }
.chip { flex: 0 0 auto; background: var(--card); border: 1px solid #2a2a2a; color: var(--text-muted); padding: 9px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.badge { display: inline-block; background: var(--accent); color: #000; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
.badge.vostfr { background: #06c; color: #fff; }
.badge.truefrench { background: #0a7; color: #fff; }
.detail { display: flex; gap: 30px; flex-wrap: wrap; margin-bottom: 40px; }
.detail img.poster { width: 260px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
.detail .meta { flex: 1; min-width: 280px; }
.detail h1 { font-size: 32px; margin-bottom: 12px; }
.detail .tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.tag { background: var(--bg-2); padding: 4px 10px; border-radius: 20px; font-size: 12px; color: var(--text-muted); border: 1px solid #333; }
.synopsis { line-height: 1.7; color: #ccc; margin: 16px 0; }
.btn { display: inline-block; background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #000; padding: 12px 24px; border-radius: 8px; font-weight: 800; text-decoration: none; border: none; cursor: pointer; font-size: 15px; transition: .2s; }
.btn:hover { transform: scale(1.05); }
.episodes-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 20px; }
.episode-item { background: var(--bg-2); padding: 12px 16px; border-radius: 8px; border: 1px solid #2a2a35; cursor: pointer; transition: .2s; color: var(--text); text-decoration: none; display: block; }
.episode-item:hover { border-color: var(--accent); background: var(--card); }
.episode-item .saison { font-size: 11px; color: var(--accent); font-weight: 700; }
.player-wrap { width: 100%; max-width: 1100px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
.player-wrap iframe { width: 100%; height: 100%; border: none; }
.servers-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px auto; max-width: 1100px; justify-content: center; }
.server-btn { background: var(--bg-2); border: 1px solid #333; color: var(--text); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: .2s; }
.server-btn:hover, .server-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
.error-box { text-align: center; padding: 80px 20px; max-width: 500px; margin: 0 auto; }
.error-icon { color: var(--accent); margin-bottom: 14px; }
.error-icon svg { width: 40px; height: 40px; }
.error-box h2 { font-size: 26px; margin-bottom: 12px; color: var(--text); }
.error-box p { color: var(--text-muted); margin-bottom: 24px; }
.pagination { display: flex; justify-content: center; gap: 10px; margin: 30px 0; flex-wrap: wrap; }
.pagination button { background: var(--bg-2); border: 1px solid #333; color: var(--text); padding: 8px 16px; border-radius: 6px; cursor: pointer; }
.pagination button:disabled { opacity: .3; cursor: not-allowed; }
.pagination button.active { background: var(--accent); color: #000; font-weight: 700; }
.retry-banner { position: fixed; top: 0; left: 0; right: 0; z-index: 999; display: flex; align-items: center; justify-content: center; gap: 16px; padding: 10px 16px; background: var(--accent); color: #fff; font-size: 14px; text-align: center; }
.retry-banner button { background: #fff; color: var(--accent); border: none; border-radius: 4px; padding: 4px 12px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
.retry-banner-msg { display: flex; align-items: center; gap: 8px; }
.retry-banner-msg svg { width: 18px; height: 18px; flex-shrink: 0; }
.loader { text-align: center; padding: 60px; color: var(--accent); font-size: 18px; }
.loader::after { content: ""; display: inline-block; width: 20px; height: 20px; border: 3px solid var(--accent); border-top-color: transparent; border-radius: 50%; margin-left: 10px; vertical-align: middle; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.account-menu { display: flex; align-items: center; gap: 14px; margin-left: auto; position: relative; }
.account-link { color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 14px; }
.account-link:hover { color: var(--accent); }
.account-btn-signup { padding: 8px 16px; font-size: 14px; }
.account-avatar { width: 38px; height: 38px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #000; border: none; font-weight: 900; font-size: 16px; cursor: pointer; }
.account-dropdown { position: absolute; top: 48px; right: 0; background: var(--card); border: 1px solid #2a2a35; border-radius: 10px; min-width: 200px; padding: 8px; display: none; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 200; }
.account-dropdown.open { display: flex; }
.account-dropdown-name { padding: 8px 10px 2px; font-weight: 700; }
.account-dropdown-sub { padding: 0 10px 6px; font-size: 12px; color: var(--text-muted); }
.account-dropdown-sub:last-of-type { border-bottom: 1px solid #2a2a35; padding-bottom: 10px; margin-bottom: 6px; }
.account-dropdown a, .account-dropdown button { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text); text-decoration: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.account-dropdown a:hover, .account-dropdown button:hover { background: rgba(226,38,28,.12); color: var(--accent); }
.hero { position: relative; height: 78vh; min-height: 420px; display: flex; align-items: flex-end; padding: 60px 40px; margin: -1px -24px 40px; background-size: cover; background-position: center top; }
.hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,15,.2) 0%, rgba(10,10,15,.5) 55%, var(--bg) 97%), linear-gradient(90deg, rgba(10,10,15,.9) 0%, rgba(10,10,15,.2) 55%); }
.hero-content { position: relative; max-width: 560px; }
.hero-content h1 { font-size: 42px; font-weight: 900; margin-bottom: 14px; text-shadow: 0 4px 20px rgba(0,0,0,.6); }
.hero-badges { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.hero-content p { color: #eee; line-height: 1.6; margin-bottom: 22px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
.hero-actions { display: flex; gap: 14px; flex-wrap: wrap; }
.btn-outline { display: inline-block; background: rgba(120,120,130,.4); color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: 800; text-decoration: none; border: none; cursor: pointer; font-size: 15px; backdrop-filter: blur(4px); }
.btn-outline:hover { background: rgba(120,120,130,.6); }
.rows-wrap { padding: 0 16px; }
.row-block { margin-bottom: 38px; }
.row-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 8px; margin-bottom: 14px; }
.row-head h2 { font-size: 20px; border-left: 4px solid var(--accent); padding-left: 12px; }
.row-head a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 600; cursor: pointer; }
.row-head a:hover { color: var(--accent); }
.row-scroll { display: flex; gap: 14px; overflow-x: auto; padding: 4px 8px 14px; scroll-behavior: smooth; }
.row-scroll::-webkit-scrollbar { height: 8px; }
.row-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 8px; }
.row-scroll::-webkit-scrollbar-track { background: transparent; }
.row-card { flex: 0 0 auto; width: 160px; background: var(--card); border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit; transition: .25s; position: relative; }
.mylist-heart { position: absolute; top: 8px; right: 8px; z-index: 5; width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(10,10,10,.7); color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
.mylist-heart.active { color: var(--accent); }
.mylist-heart:hover { background: rgba(10,10,10,.9); }
.row-card:hover { transform: translateY(-5px) scale(1.03); box-shadow: 0 8px 24px rgba(226,38,28,.25); }
.row-card img { width: 100%; height: 230px; object-fit: cover; display: block; background: #222; }
.row-card-badge { position: absolute; left: 8px; bottom: 8px; z-index: 4; }
.auth-wrap { max-width: 440px; margin: 60px auto; background: var(--card); border-radius: 14px; padding: 40px 32px; border: 1px solid #2a2a35; }
.auth-wrap h1 { font-size: 26px; margin-bottom: 6px; }
.auth-wrap .sub { color: var(--text-muted); font-size: 14px; margin-bottom: 26px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
.field input, .field select { width: 100%; background: var(--bg-2); border: 1px solid #333; color: var(--text); padding: 12px 14px; border-radius: 8px; outline: none; font-size: 14px; }
.field input:focus, .field select:focus { border-color: var(--accent); }
.field-row { display: flex; gap: 12px; }
.field-row .field { flex: 1; }
.field-error { color: #ff5c5c; font-size: 12px; margin-top: 6px; display: none; }
.field.invalid input { border-color: #ff5c5c; }
.field.invalid .field-error { display: block; }
.auth-submit { width: 100%; margin-top: 8px; }
.auth-switch { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); }
.auth-switch a { color: var(--accent); text-decoration: none; font-weight: 700; cursor: pointer; }
.notice-banner { background: rgba(226,38,28,.12); border: 1px solid rgba(226,38,28,.3); color: var(--accent); padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 22px; line-height: 1.5; display: flex; gap: 10px; align-items: flex-start; }
.settings-section { background: var(--card); border: 1px solid #2a2a35; border-radius: 12px; padding: 26px 28px; margin-bottom: 24px; max-width: 640px; }
.settings-section h2 { font-size: 18px; margin-bottom: 18px; border-left: 4px solid var(--accent); padding-left: 12px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #2a2a35; }
.toggle-row:last-child { border-bottom: none; }
.toggle-row .label { font-size: 14px; }
.toggle-row .label small { display: block; color: var(--text-muted); font-size: 12px; margin-top: 2px; }
.switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider { position: absolute; inset: 0; background: #333; border-radius: 24px; cursor: pointer; transition: .2s; }
.switch .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::before { transform: translateX(20px); }
.save-confirm { color: #0a7; font-size: 13px; margin-top: 10px; display: none; font-weight: 700; }
.welcome-body { padding-bottom: 0; }
.welcome-bg { position: fixed; inset: 0; z-index: -2; display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; overflow: hidden; }
.welcome-bg img { width: 100%; height: 100%; object-fit: cover; opacity: .55; filter: saturate(1.1); }
.welcome-overlay { position: fixed; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(10,10,10,.75) 0%, rgba(10,10,10,.9) 55%, var(--bg) 100%), linear-gradient(90deg, rgba(10,10,10,.6) 0%, rgba(10,10,10,.2) 50%, rgba(10,10,10,.6) 100%); }
.welcome-header { display: flex; align-items: center; justify-content: space-between; padding: 22px 40px; }
.logo-lg { font-size: 22px; }
.welcome-login-btn { padding: 9px 22px; font-size: 14px; }
.welcome-credit { position: relative; z-index: 2; text-align: center; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: 2px; margin-top: -6px; margin-bottom: 6px; }
.welcome-hero { text-align: center; max-width: 720px; margin: 0 auto; padding: 90px 24px 70px; }
.welcome-hero h1 { font-size: 48px; font-weight: 900; line-height: 1.15; margin-bottom: 20px; letter-spacing: -1px; text-shadow: 0 6px 30px rgba(0,0,0,.5); }
.welcome-sub { font-size: 19px; color: #d8d8d8; line-height: 1.65; margin-bottom: 36px; max-width: 560px; margin-left: auto; margin-right: auto; }
.welcome-form { display: flex; gap: 10px; max-width: 560px; margin: 0 auto 14px; flex-wrap: wrap; justify-content: center; }
.welcome-form input { flex: 1; min-width: 220px; background: rgba(23,23,23,.85); border: 1px solid #3a3a3a; color: var(--text); padding: 15px 18px; border-radius: 8px; outline: none; font-size: 15px; }
.welcome-form input:focus { border-color: var(--accent); }
.welcome-cta { font-size: 17px; padding: 15px 28px; white-space: nowrap; }
.welcome-note { color: var(--text-muted); font-size: 14px; }
.welcome-note a { color: var(--accent); text-decoration: none; font-weight: 700; cursor: pointer; }
.welcome-features { position: relative; max-width: 1000px; margin: 0 auto; padding: 50px 24px 70px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; border-top: 1px solid #201414; }
.feature { text-align: center; padding: 10px; }
.feature-icon { width: 58px; height: 58px; margin: 0 auto 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(226,38,28,.25), rgba(226,38,28,.06)); border: 1px solid rgba(226,38,28,.3); color: var(--accent); display: flex; align-items: center; justify-content: center; }
.feature-icon svg { width: 26px; height: 26px; }
.feature h3 { font-size: 17px; margin-bottom: 8px; font-weight: 800; }
.feature p { color: var(--text-muted); font-size: 14px; line-height: 1.65; }
.welcome-footer { text-align: center; padding: 28px 20px; color: #666; font-size: 12px; border-top: 1px solid #1a1a1a; }
@media (max-width: 700px) {
  .hero { height: 60vh; padding: 30px 20px; margin: -1px -16px 24px; }
  .hero-content h1 { font-size: 28px; }
  .row-card { width: 128px; }
  .row-card img { height: 185px; }
  .auth-wrap { margin: 30px 16px; padding: 28px 20px; }
  .field-row { flex-direction: column; gap: 0; }
  .welcome-header { padding: 16px 20px; }
  .welcome-hero h1 { font-size: 30px; }
  .welcome-sub { font-size: 15px; }
  .welcome-features { grid-template-columns: 1fr; }
  .welcome-form { flex-direction: column; }
  .welcome-bg { grid-template-columns: repeat(3, 1fr); }
  header { padding: 12px; }
  .logo { font-size: 20px; }
  .search-box { width: 100%; margin-left: 0; }
  .search-box input { width: 100%; }
  main { padding: 16px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .card img { height: 190px; }
  .detail h1 { font-size: 24px; }
  .detail img.poster { width: 100%; max-width: 260px; margin: 0 auto; }
}
.back-btn { background: var(--bg-2); border: 1px solid #333; color: var(--text); width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-left: auto; }
.back-btn svg { width: 20px; height: 20px; }
.back-btn:hover { border-color: var(--accent); color: var(--accent); }
.search-hero { padding: 10px 0 24px; }
.search-box-lg { max-width: 560px; margin: 0 auto; background: var(--card); border: 1px solid #2a2a2a; border-radius: 10px; padding: 4px 16px; display: flex; align-items: center; gap: 10px; }
.search-box-lg .search-icon { color: var(--text-muted); display: flex; }
.search-box-lg input { flex: 1; background: none; border: none; color: var(--text); padding: 14px 0; outline: none; font-size: 15px; }
.card, .row-card { overflow: hidden; }
.card a, .row-card a { position: relative; display: block; }
.card a::after, .row-card a::after { content: "▶"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; background: rgba(10,10,10,.45); opacity: 0; transition: opacity .2s; pointer-events: none; }
.card:hover a::after, .row-card:hover a::after { opacity: 1; }
.has-bottom-nav { padding-bottom: 78px; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 600; display: flex; background: rgba(10,10,10,.97); border-top: 1px solid #222; padding: 8px 4px calc(8px + env(safe-area-inset-bottom)); backdrop-filter: blur(10px); }
.bottom-nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #7a7a7a; text-decoration: none; font-size: 10.5px; font-weight: 600; padding: 4px 0; cursor: pointer; }
.bottom-nav a svg { width: 22px; height: 22px; }
.bottom-nav a.active { color: var(--accent); }
.bottom-nav a.active svg { stroke: var(--accent); }
.search-box button svg, .search-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

/* ===== FICHE DÉTAIL — façon Netflix ===== */
.dhero { position: relative; min-height: 56vh; background-size: cover; background-position: center 20%; margin: -24px -24px 0; padding: 70px 40px 46px; display: flex; align-items: flex-end; }
.dhero::before { content: ""; position: absolute; inset: 0; background:
    linear-gradient(180deg, rgba(10,10,10,.15) 0%, rgba(10,10,10,.55) 60%, var(--bg) 100%),
    linear-gradient(90deg, rgba(10,10,10,.92) 0%, rgba(10,10,10,.25) 55%, rgba(10,10,10,.1) 100%); }
.dhero-content { position: relative; max-width: 640px; }
.dhero-content h1 { font-size: 40px; font-weight: 900; margin-bottom: 12px; text-shadow: 0 6px 24px rgba(0,0,0,.6); line-height: 1.1; }
.dhero-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.dhero-meta .year { color: var(--text-muted); font-weight: 700; font-size: 14px; }
.dhero-synopsis { color: #eee; line-height: 1.7; margin-bottom: 24px; text-shadow: 0 2px 12px rgba(0,0,0,.7); max-width: 560px; }
.dhero-actions { display: flex; gap: 14px; flex-wrap: wrap; }
.dhero-actions .btn { font-size: 16px; padding: 13px 30px; }

.detail-body { max-width: 1100px; margin: 34px auto 0; padding: 0 4px; }
.detail-body-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-bottom: 6px; }

.season-select-wrap { position: relative; }
.season-select {
  appearance: none; -webkit-appearance: none; background: var(--card); color: var(--text);
  border: 1px solid #2a2a35; border-radius: 8px; padding: 10px 36px 10px 16px;
  font-size: 14px; font-weight: 700; cursor: pointer; outline: none;
}
.season-select:focus { border-color: var(--accent); }
.season-select-wrap::after {
  content: "▾"; position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); pointer-events: none; font-size: 13px;
}

.ep-rows { display: flex; flex-direction: column; gap: 2px; margin-top: 18px; }
.ep-row {
  display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 10px;
  background: var(--bg-2); border: 1px solid transparent; text-decoration: none; color: var(--text);
  transition: .15s; cursor: pointer;
}
.ep-row:hover { background: var(--card); border-color: #2a2a35; }
.ep-row .ep-num { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; background: #262626; color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; }
.ep-row:hover .ep-num { background: var(--accent); color: #000; }
.ep-row .ep-info { flex: 1; min-width: 0; }
.ep-row .ep-info .ep-title { font-weight: 700; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ep-row .ep-info .ep-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.ep-row .ep-play { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
.ep-row:hover .ep-play { color: var(--accent); }

.similar-row { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 14px; scroll-behavior: smooth; }

@media (max-width: 700px) {
  .dhero { margin: -16px -16px 0; padding: 40px 20px 32px; min-height: 46vh; }
  .dhero-content h1 { font-size: 28px; }
}

/* =====================================================================
   PRINCE MOVIE — couche de design premium (v6)
   ===================================================================== */
:root { --gold: #e8bf6f; --gold-2: #d9a13c; --ease: cubic-bezier(.2,.7,.2,1); }
html { scroll-behavior: smooth; }
body {
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(229,9,20,.10), transparent 60%),
    radial-gradient(900px 500px at -10% 30%, rgba(232,191,111,.05), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent); color: #fff; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #2c2c2c; border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* En-tête en verre dépoli */
header { backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
  background: rgba(10,10,10,.72); border-bottom: 1px solid rgba(255,255,255,.06); }
header.transparent-header { backdrop-filter: none; -webkit-backdrop-filter: none;
  background: linear-gradient(180deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,0) 100%); }
.logo { font-weight: 900; letter-spacing: 2px;
  background: linear-gradient(90deg, #fff 30%, var(--gold) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo .logo-mark { filter: drop-shadow(0 4px 14px rgba(229,9,20,.45)); transition: transform .4s var(--ease); }
.logo:hover .logo-mark { transform: rotate(-8deg) scale(1.08); }
header nav a { position: relative; }
header nav a::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 2px; height: 2px; border-radius: 2px;
  background: var(--accent); transform: scaleX(0); transition: transform .3s var(--ease); }
header nav a:hover::after, header nav a.active::after { transform: scaleX(1); }
header nav a:hover, header nav a.active { background: transparent; color: #fff; }
.search-box input, .search-box-lg { transition: border-color .25s, box-shadow .25s, background .25s; }
.search-box input:focus, .search-box-lg:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(229,9,20,.18); }
.search-box button { color: #fff; }

/* Boutons */
.btn { color: #fff; background: linear-gradient(135deg, #f0182b 0%, var(--accent) 45%, var(--accent-2) 100%);
  box-shadow: 0 8px 24px rgba(229,9,20,.35), inset 0 1px 0 rgba(255,255,255,.18); letter-spacing: .3px;
  transition: transform .25s var(--ease), box-shadow .25s var(--ease), filter .25s; }
.btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 14px 34px rgba(229,9,20,.5), inset 0 1px 0 rgba(255,255,255,.22); filter: brightness(1.08); }
.btn:active { transform: scale(.98); }
.btn-outline { backdrop-filter: blur(10px); background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.28); color: #fff;
  transition: background .25s, transform .25s var(--ease), border-color .25s; }
.btn-outline:hover { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.5); transform: translateY(-2px); }

/* Bannière d'accueil */
.hero { min-height: 78vh; background-size: cover; background-position: center 22%; position: relative; animation: heroIn .9s var(--ease) both; }
.hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40%;
  background: linear-gradient(180deg, transparent, var(--bg)); pointer-events: none; }
.hero-content { position: relative; z-index: 2; animation: riseIn .9s .15s var(--ease) both; }
.hero-content h1 { font-size: clamp(34px, 5.4vw, 66px); font-weight: 900; letter-spacing: -1.5px; line-height: 1.02; text-shadow: 0 8px 40px rgba(0,0,0,.7); }
.hero-content p { text-shadow: 0 2px 16px rgba(0,0,0,.8); }
.hero-badges .badge { box-shadow: 0 4px 14px rgba(0,0,0,.4); }

/* Titres de sections */
.row-head h2, h1.section-title, .settings-section h2 {
  border-left: 0; padding-left: 0; display: inline-flex; align-items: center; gap: 12px; letter-spacing: -.3px; }
.row-head h2::before, h1.section-title::before, .settings-section h2::before {
  content: ""; width: 5px; height: 1.05em; border-radius: 4px; background: linear-gradient(180deg, var(--accent), var(--gold)); }
.row-head a { transition: color .2s, transform .2s; }
.row-head a:hover { transform: translateX(3px); }
.row-block { animation: riseIn .7s var(--ease) both; }
.row-block:nth-child(2) { animation-delay: .06s; } .row-block:nth-child(3) { animation-delay: .12s; }
.row-block:nth-child(4) { animation-delay: .18s; } .row-block:nth-child(5) { animation-delay: .24s; }

/* Cartes : affiche, halo, dégradé bas, éclat au survol */
.card, .row-card { border-radius: 14px; background: #161616; border: 1px solid rgba(255,255,255,.05);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s; will-change: transform; }
.card:hover, .row-card:hover { transform: translateY(-8px) scale(1.05); border-color: rgba(229,9,20,.55); z-index: 3;
  box-shadow: 0 22px 44px rgba(0,0,0,.65), 0 0 0 1px rgba(229,9,20,.25), 0 0 34px rgba(229,9,20,.28); }
.card img, .row-card img { transition: transform .6s var(--ease), filter .35s; }
.card:hover img, .row-card:hover img { transform: scale(1.07); filter: brightness(.7) saturate(1.15); }
.card a::before, .row-card a::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.85) 100%); }
.card a::after, .row-card a::after { z-index: 3; font-size: 22px; width: 54px; height: 54px; inset: auto; top: 50%; left: 50%;
  margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(229,9,20,.92); box-shadow: 0 10px 30px rgba(229,9,20,.6);
  transform: scale(.6); transition: opacity .25s, transform .35s var(--ease); padding-left: 4px; }
.card:hover a::after, .row-card:hover a::after { transform: scale(1); }
.row-card-badge, .card-ep-tag { z-index: 4; backdrop-filter: blur(6px); }
.badge { color: #fff; border-radius: 6px; padding: 3px 8px; letter-spacing: .4px; }
.mylist-heart { backdrop-filter: blur(8px); transition: transform .25s var(--ease), background .2s, color .2s; }
.mylist-heart:hover { transform: scale(1.18); }
.mylist-heart.active { animation: pop .35s var(--ease); }

/* Puces de catalogue */
.chip { border-radius: 999px; padding: 10px 22px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
  transition: transform .25s var(--ease), background .25s, border-color .25s, color .25s, box-shadow .25s; }
.chip:hover { color: #fff; border-color: rgba(229,9,20,.6); transform: translateY(-2px); }
.chip.active { background: linear-gradient(135deg, #f0182b, var(--accent-2)); border-color: transparent; color: #fff; box-shadow: 0 8px 22px rgba(229,9,20,.4); }

/* Fiches détail */
.dhero-content h1 { font-size: clamp(30px, 4.6vw, 54px); letter-spacing: -1px; }
.detail-body .ep-row { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.05); border-radius: 12px; transition: transform .25s var(--ease), background .25s, border-color .25s; }
.ep-row:hover { transform: translateX(6px); background: rgba(229,9,20,.08); border-color: rgba(229,9,20,.4); }
.ep-row:hover .ep-num { color: #fff; }
.season-select { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.1); }
.tag { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.1); backdrop-filter: blur(6px); }

/* Lecteur */
.player-wrap { border-radius: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06), 0 0 60px rgba(229,9,20,.12); }
.server-btn { border-radius: 999px; background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.1); transition: transform .25s var(--ease), background .25s, border-color .25s; }
.server-btn:hover, .server-btn.active { color: #fff; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(229,9,20,.35); }

/* Formulaires, paramètres */
.auth-wrap { background: linear-gradient(180deg, rgba(30,30,30,.9), rgba(18,18,18,.92)); backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.08); border-radius: 20px; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(229,9,20,.08);
  animation: riseIn .7s var(--ease) both; }
.field input, .field select { border-radius: 10px; transition: border-color .2s, box-shadow .2s; }
.field input:focus, .field select:focus { box-shadow: 0 0 0 4px rgba(229,9,20,.16); }
.settings-section { border-radius: 18px; background: rgba(255,255,255,.03); border-color: rgba(255,255,255,.07); }
.switch input:checked + .slider { box-shadow: 0 0 14px rgba(229,9,20,.5); }

/* Page d'accueil (bienvenue) */
body.welcome-body header { background: transparent; border-bottom: 0; backdrop-filter: none; -webkit-backdrop-filter: none; position: relative; }
.welcome-hero { max-width: 860px; }
.welcome-hero h1 { background: linear-gradient(180deg, #fff 40%, #cfcfcf 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  font-size: clamp(32px, 4.6vw, 54px); animation: riseIn .9s .1s var(--ease) both; }
.welcome-sub, .welcome-form, .welcome-note { animation: riseIn .9s .25s var(--ease) both; }
.welcome-cta { border-radius: 10px; }
.feature { border-radius: 18px; padding: 26px 18px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06);
  transition: transform .35s var(--ease), border-color .35s, background .35s; }
.feature:hover { transform: translateY(-6px); border-color: rgba(229,9,20,.4); background: rgba(229,9,20,.05); }
.feature-icon { box-shadow: 0 0 30px rgba(229,9,20,.25); }

/* Barre du bas (mobile) */
.bottom-nav { background: rgba(12,12,12,.82); backdrop-filter: blur(18px) saturate(1.4); border-top: 1px solid rgba(255,255,255,.08); }
.bottom-nav a { transition: color .2s, transform .2s var(--ease); }
.bottom-nav a:active { transform: scale(.9); }
.bottom-nav a.active svg { filter: drop-shadow(0 0 8px rgba(229,9,20,.7)); }

/* Squelettes / chargement */
.loader { color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; font-size: 12px; text-align: center; padding: 60px 0; }
.loader::after { content: ""; display: block; width: 34px; height: 34px; margin: 18px auto 0; border-radius: 50%;
  border: 3px solid rgba(255,255,255,.1); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.card img, .row-card img { background: linear-gradient(90deg, #1b1b1b 25%, #262626 50%, #1b1b1b 75%); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; }
.error-box { border-radius: 20px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); }

@keyframes riseIn { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
@keyframes heroIn { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: none; } }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.45); } 100% { transform: scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (max-width: 700px) {
  .hero { min-height: 68vh; }
  .card:hover, .row-card:hover { transform: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }


/* =====================================================================
   PRINCE MOVIE — v7 : accueil carrousel, annonce, Top 10, nav mobile
   Identité propre : or + rouge carmin, pilule dorée, perforations "pellicule"
   ===================================================================== */
:root { --font: 'Sora', 'Segoe UI', system-ui, -apple-system, sans-serif; }
body { font-family: var(--font); }
.kicker { display: inline-block; color: var(--gold); font-weight: 800; font-size: 11px; letter-spacing: 2.4px; text-transform: uppercase; }

/* En-tête : logo + pilules + recherche + compte */
header { flex-wrap: nowrap; gap: 14px; padding: 12px 20px; }
.logo { flex-shrink: 0; }
.logo-text { font-size: 19px; }
.pillnav { display: flex; gap: 4px; padding: 4px; margin-left: 6px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09);
  border-radius: 999px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
header .pillnav a { padding: 8px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 700; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
header .pillnav a::after { display: none; }
header .pillnav a:hover { background: rgba(255,255,255,.08); color: #fff; }
header .pillnav a.active { background: linear-gradient(135deg, #f6d78b, var(--gold-2)); color: #1a1205; box-shadow: 0 6px 18px rgba(217,161,60,.35); }
.search-box { margin-left: auto; align-items: center; position: relative; }
.search-box + .account-menu { margin-left: 0; }
.search-icon { cursor: pointer; }

/* Annonce */
.announce { position: relative; display: flex; align-items: center; gap: 12px; padding: 9px 16px; overflow: hidden;
  background: linear-gradient(90deg, rgba(229,9,20,.24), rgba(232,191,111,.14) 60%, rgba(229,9,20,.12));
  border-bottom: 1px solid rgba(232,191,111,.28); animation: riseIn .6s var(--ease) both; }
.announce::before { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.12) 50%, transparent 65%);
  transform: translateX(-100%); animation: sweep 5.5s ease-in-out infinite; pointer-events: none; }
.announce-tag { flex-shrink: 0; font-size: 10px; font-weight: 800; letter-spacing: 1.6px; color: #1a1205; background: var(--gold); padding: 5px 10px; border-radius: 999px; }
.announce-thumb { flex-shrink: 0; width: 30px; height: 42px; border-radius: 6px; object-fit: cover; box-shadow: 0 4px 12px rgba(0,0,0,.5); background: #222; }
.announce-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.announce-text strong { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.announce-text span { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.announce-cta { flex-shrink: 0; cursor: pointer; padding: 8px 18px; border-radius: 999px; font-size: 13px; font-weight: 800; color: #fff; text-decoration: none;
  background: linear-gradient(135deg, #f0182b, var(--accent-2)); box-shadow: 0 6px 18px rgba(229,9,20,.4); transition: transform .25s var(--ease); }
.announce-cta:hover { transform: translateY(-1px) scale(1.04); }
.announce-x { flex-shrink: 0; background: none; border: 0; color: var(--text-muted); font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
.announce-x:hover { color: #fff; background: rgba(255,255,255,.08); }
@keyframes sweep { 0%, 60% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

/* Carrousel */
.stage { position: relative; height: clamp(480px, calc(100svh - 200px), 760px); overflow: hidden; isolation: isolate; margin: 0; padding: 0; display: block; animation: heroIn .8s var(--ease) both; }
.stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 9px; z-index: 6; pointer-events: none;
  background: repeating-linear-gradient(90deg, rgba(232,191,111,.42) 0 12px, transparent 12px 26px); opacity: .55; }
.stage-slides { position: absolute; inset: 0; }
.slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .9s var(--ease), visibility .9s; }
.slide.on { opacity: 1; visibility: visible; z-index: 2; }
.slide-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 22%; transform: scale(1.1); transition: transform 9s linear; background: #151515; }
.slide.on .slide-bg { transform: scale(1); }
.slide-shade { position: absolute; inset: 0;
  background: linear-gradient(0deg, var(--bg) 3%, rgba(10,10,10,.78) 30%, rgba(10,10,10,.12) 68%, rgba(10,10,10,.35) 100%),
              linear-gradient(90deg, rgba(10,10,10,.82) 0%, rgba(10,10,10,0) 68%); }
.slide-poster { display: none; }
.slide-copy { position: absolute; left: 0; right: 0; bottom: 96px; padding: 0 24px; max-width: 680px; }
.slide.on .slide-copy > * { animation: riseIn .8s var(--ease) both; }
.slide.on .slide-copy > *:nth-child(2) { animation-delay: .08s; } .slide.on .slide-copy > *:nth-child(3) { animation-delay: .16s; }
.slide.on .slide-copy > *:nth-child(4) { animation-delay: .24s; } .slide.on .slide-copy > *:nth-child(5) { animation-delay: .32s; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 12px; }
.chip-t { display: inline-flex; align-items: center; padding: 6px 13px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .4px;
  background: rgba(10,10,10,.55); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.chip-star { color: var(--gold); border-color: rgba(232,191,111,.45); }
.slide-copy h1 { font-size: clamp(30px, 8.4vw, 62px); font-weight: 800; letter-spacing: -1.6px; line-height: 1.02; margin-bottom: 14px; text-shadow: 0 8px 40px rgba(0,0,0,.7); }
.slide-copy p { color: #d6d6d6; line-height: 1.6; font-size: 15px; max-width: 560px; margin-bottom: 22px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.slide-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.slide-actions .btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 26px; font-size: 15px; border-radius: 14px; cursor: pointer; }
.btn-ghost { display: inline-flex; align-items: center; padding: 14px 22px; border-radius: 14px; cursor: pointer; font: inherit; font-size: 15px; font-weight: 700; color: #fff;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: background .25s, transform .25s var(--ease), border-color .25s; }
.btn-ghost:hover { background: rgba(255,255,255,.16); border-color: rgba(232,191,111,.6); transform: translateY(-2px); }
.stage-ctrl { position: absolute; right: 20px; bottom: 26px; z-index: 7; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 999px;
  background: rgba(10,10,10,.6); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.stage-arrow { background: none; border: 0; color: #fff; font-size: 24px; line-height: 1; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; transition: background .2s, color .2s; }
.stage-arrow:hover { background: rgba(232,191,111,.2); color: var(--gold); }
.stage-dots { display: flex; align-items: center; gap: 6px; }
.stage-dot { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 999px; background: rgba(255,255,255,.35); cursor: pointer; transition: width .35s var(--ease), background .35s; }
.stage-dot.on { width: 26px; background: linear-gradient(90deg, #f6d78b, var(--gold-2)); }

@media (min-width: 900px) {
  .slide-bg { filter: blur(26px) brightness(.6) saturate(1.25); transform: scale(1.25); object-position: center; }
  .slide.on .slide-bg { transform: scale(1.15); }
  .slide-poster { display: block; position: absolute; right: 9%; top: 50%; height: 70%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 20px; z-index: 3;
    transform: translateY(-50%) rotate(3deg); background: #1a1a1a; border: 1px solid rgba(232,191,111,.35);
    box-shadow: 0 40px 90px rgba(0,0,0,.75), 0 0 80px rgba(229,9,20,.25); }
  .slide-copy { padding: 0 0 0 56px; }
  .stage-ctrl { right: 56px; }
}

/* Cartes : étiquette de type, note, cœur en bas à droite */

<script>
/* =========================================================
   API — cœur de communication avec le backend PRINCE MOVIE
   ========================================================= */
const API_BASE = "http://51.75.118.170:20041/api/v1";

// Proxy interne, servi par ton propre projet Vercel (fonction serverless
// api/proxy.js fournie à côté — voir ce fichier pour les instructions
// d'installation). Comme il tourne sur ton domaine et côté serveur, il
// évite à la fois le blocage HTTPS→HTTP du navigateur et la lenteur des
// proxys publics saturés. "/api/proxy?url=" est un chemin RELATIF : il
// fonctionne automatiquement une fois déployé sur Vercel, sans rien à
// configurer de plus ici.
const MY_PROXY_URL = "/api/proxy?url=";

const PROXIES = [
  // BUGFIX : le proxy interne (s'il répond) passe toujours en premier — il
  // n'est utilisé que par ce site, donc bien plus rapide et fiable que les
  // proxys publics ci-dessous, partagés par des milliers de sites et
  // souvent saturés/rate-limités. Ces derniers restent en repli si jamais
  // le proxy interne n'est pas déployé (ex: fichier ouvert en local).
  MY_PROXY_URL,
  "https://api.allorigins.win/raw?url=",
  "https://corsproxy.io/?url=",
  "https://api.codetabs.com/v1/proxy?quest=",
  "https://api.cors.lol/?url=",
];

// BUGFIX : quand un proxy vient de fonctionner, on le retente en priorité la
// fois suivante (au lieu de toujours repartir dans le même ordre) — ça évite
// de re-taper inutilement sur un proxy qui vient d'être rate-limité pendant
// que le suivant, lui, répond très bien.
function orderedProxies() {
  let lastGoodIdx = -1;
  try { lastGoodIdx = Number(sessionStorage.getItem("pm_last_proxy_idx")); } catch (e) {}
  if (!Number.isInteger(lastGoodIdx) || lastGoodIdx < 0 || lastGoodIdx >= PROXIES.length) return PROXIES.map((p, i) => [p, i]);
  const rest = PROXIES.map((p, i) => [p, i]).filter(([, i]) => i !== lastGoodIdx);
  return [[PROXIES[lastGoodIdx], lastGoodIdx], ...rest];
}

const CACHE_TTL_MS = 5 * 60 * 1000;
const memCache = new Map();

function cacheRead(key) {
  const now = Date.now();
  const mem = memCache.get(key);
  if (mem && now - mem.t < CACHE_TTL_MS) return mem.v;
  try {
    const raw = sessionStorage.getItem("pm_cache:" + key);
    if (!raw) return null;
    const { t, v } = JSON.parse(raw);
    if (now - t >= CACHE_TTL_MS) return null;
    memCache.set(key, { t, v });
    return v;
  } catch (e) { return null; }
}
function cacheWrite(key, v) {
  const entry = { t: Date.now(), v };
  memCache.set(key, entry);
  try { sessionStorage.setItem("pm_cache:" + key, JSON.stringify(entry)); } catch (e) {}
  // Copie "dernière version connue", sans expiration, dans localStorage :
  // sert de filet de secours si une future requête échoue complètement
  // (proxys en rate-limit, etc.) plutôt que de faire disparaître la section.
  try { localStorage.setItem("pm_lastgood:" + key, JSON.stringify(v)); } catch (e) {}
}
function cacheReadLastGood(key) {
  try {
    const raw = localStorage.getItem("pm_lastgood:" + key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

// BUGFIX : les proxys CORS publics gratuits (allorigins/corsproxy/codetabs)
// se mettent en rate-limit quand trop de requêtes partent en même temps —
// ce qui arrivait à chaque chargement de l'accueil (5 sections × plusieurs
// sources en parallèle). On limite le nombre de requêtes proxy simultanées
// pour éviter ces échecs intermittents ("parfois les films n'apparaissent
// pas").
class Semaphore {
  constructor(max) { this.max = max; this.count = 0; this.queue = []; }
  acquire() {
    return new Promise(resolve => {
      const tryAcquire = () => {
        if (this.count < this.max) { this.count++; resolve(() => this.release()); }
        else this.queue.push(tryAcquire);
      };
      tryAcquire();
    });
  }
  release() { this.count--; const next = this.queue.shift(); if (next) next(); }
}
const proxySemaphore = new Semaphore(4);

async function apiRaw(path, params = {}) {
  const url = new URL(API_BASE + path);
  Object.entries(params).forEach(([k, v]) => {
    if (v !== null && v !== undefined && v !== "") url.searchParams.set(k, v);
  });
  const urlStr = url.toString();
  const cacheKey = urlStr;
  const cached = cacheRead(cacheKey);
  if (cached) return cached;

  // On tente TOUJOURS un appel direct (sans proxy) en même temps que les
  // proxys CORS : si l'API autorise déjà les requêtes cross-origin, c'est
  // presque toujours la plus rapide et la plus fiable des sources.
  const directController = new AbortController();
  const directTimer = setTimeout(() => directController.abort(), 9000);
  const directAttempt = fetch(urlStr, { signal: directController.signal })
    .then(async (res) => {
      let json;
      try { json = await res.json(); }
      catch (e) { throw new Error("Réponse invalide de l'API."); }
      if (json && json.success === false) {
        const err = new Error(json.error?.message || "Erreur inconnue.");
        err.code = json.error?.code;
        throw err;
      }
      return json;
    })
    .finally(() => clearTimeout(directTimer));

  const orderedList = orderedProxies();
  const controllers = orderedList.map(() => new AbortController());
  const attempts = orderedList.map(([proxy, i], orderIdx) => (async () => {
    const release = await proxySemaphore.acquire();
    const timer = setTimeout(() => controllers[orderIdx].abort(), 9000);
    try {
      const res = await fetch(proxy + encodeURIComponent(urlStr), { signal: controllers[orderIdx].signal });
      let json;
      try { json = await res.json(); }
      catch (e) { throw new Error("Réponse invalide du proxy."); }
      if (!json.success) {
        const err = new Error(json.error?.message || "Erreur inconnue.");
        err.code = json.error?.code;
        throw err;
      }
      try { sessionStorage.setItem("pm_last_proxy_idx", String(i)); } catch (e) {}
      return json;
    } finally {
      clearTimeout(timer);
      release();
    }
  })());
  attempts.push(directAttempt);

  try {
    const json = await Promise.any(attempts);
    controllers.forEach(c => c.abort());
    directController.abort();
    cacheWrite(cacheKey, json);
    return json;
  } catch (aggregateErr) {
    // Dernier filet : si on a déjà réussi à charger cette même ressource
    // par le passé (même après la fenêtre de cache normale), on la réutilise
    // plutôt que de faire disparaître la section à l'écran.
    const lastGood = cacheReadLastGood(cacheKey);
    if (lastGood) return lastGood;
    const errors = (aggregateErr && aggregateErr.errors) || [aggregateErr];
    const lastErr = errors[errors.length - 1];
    const err = new Error(lastErr?.message || "Source indisponible. Réessaie dans un instant.");
    err.code = lastErr?.code || "source_unavailable";
    throw err;
  }
}

// BUGFIX : certains endpoints peuvent attendre un nom de
// paramètre différent selon la version de l'API ("chapter" vs "chapter_id").
// On essaie la forme principale, et seulement si elle échoue on retente
// avec la forme alternative. Et dans tous les cas, avant d'abandonner et
// d'afficher une erreur à l'écran, on retente une dernière fois après une
// courte pause : les proxys publics ont parfois des ratés ponctuels qui
// n'ont rien à voir avec une vraie panne de l'API.
// L'API peut renvoyer le même titre plusieurs fois dans une liste : on garde
// la première occurrence (par slug), uniquement pour les listes de titres.
const LIST_PATH_RE = /^\/(movies|series|anime|dramas|search)$/;
function dedupeResult(path, json) {
  if (!LIST_PATH_RE.test(path) || !json || !Array.isArray(json.data)) return json;
  const seen = new Set();
  json.data = json.data.filter(it => {
    const key = it && it.slug;
    if (!key) return true;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  return json;
}
async function api(path, params = {}, altParams = null) {
  try {
    return dedupeResult(path, await apiRaw(path, params));
  } catch (e1) {
    if (altParams) {
      try { return dedupeResult(path, await apiRaw(path, altParams)); }
      catch (e2) { /* on retombe sur la dernière tentative ci-dessous */ }
    }
    await new Promise(r => setTimeout(r, 700));
    return dedupeResult(path, await apiRaw(path, params));
  }
}

/* =========================================================
   COMPTE (mock front-end uniquement, stocké en localStorage)
   ========================================================= */
const AUTH_KEY = "pm_user";
const SESSION_KEY = "pm_session";
const MYLIST_KEY = "pm_mylist";
const PUBLIC_ROUTES = ["index", "inscription", "connexion"];

function getCurrentUser() {
  try { const raw = localStorage.getItem(AUTH_KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function isLoggedIn() {
  return sessionStorage.getItem(SESSION_KEY) === "1" || localStorage.getItem(SESSION_KEY) === "1";
}
function registerUser({ nom, prenom, email, telephone, password }) {
  const user = { nom, prenom, email, telephone, password };
  localStorage.setItem(AUTH_KEY, JSON.stringify(user));
  localStorage.setItem(SESSION_KEY, "1");
}
function loginUser(email, password) {
  const user = getCurrentUser();
  if (!user) return { ok: false, message: "Aucun compte trouvé. Inscris-toi d'abord." };
  if (user.email.toLowerCase() !== email.toLowerCase() || user.password !== password) {
    return { ok: false, message: "Email ou mot de passe incorrect." };
  }
  localStorage.setItem(SESSION_KEY, "1");
  return { ok: true };
}
function logoutUser() {
  localStorage.removeItem(SESSION_KEY);
  sessionStorage.removeItem(SESSION_KEY);
  nav("index"); // BUGFIX : "accueil" est une route protégée, ça provoquait un aller-retour
  renderChrome();
}
function updateUser(patch) {
  const user = getCurrentUser() || {};
  const updated = { ...user, ...patch };
  localStorage.setItem(AUTH_KEY, JSON.stringify(updated));
  return updated;
}

/* ---------- Ma Liste ---------- */
function getMyList() {
  try { return JSON.parse(localStorage.getItem(MYLIST_KEY) || "[]"); }
  catch (e) { return []; }
}
function isInMyList(slug) { return getMyList().some(i => i.slug === slug); }
function toggleMyList(item) {
  const list = getMyList();
  const idx = list.findIndex(i => i.slug === item.slug);
  if (idx >= 0) { list.splice(idx, 1); }
  else { list.unshift({ slug: item.slug, title: item.title, image: item.image, type: item.type, version: item.version }); }
  localStorage.setItem(MYLIST_KEY, JSON.stringify(list));
  return idx < 0;
}

/* =========================================================
   ROUTAGE (hash-based, un seul fichier index.html)
   ========================================================= */
function currentRoute() {
  let hash = location.hash.replace(/^#\/?/, "");
  // BUGFIX : sans hash (première ouverture du site), on affiche toujours la
  // page de bienvenue en premier, connecté ou non — demande explicite :
  // "il faut que le site ait toujours cette page".
  if (!hash) hash = "index";
  const [path, queryStr] = hash.split("?");
  return { path: path || "index", params: new URLSearchParams(queryStr || "") };
}
function nav(pathWithQuery) { location.hash = "#/" + pathWithQuery; }
function getParam(key) { return currentRoute().params.get(key); }
function getSlug(key = "slug") { return getParam(key); }

// BUGFIX : les pages produit renvoyaient des "type" pas toujours cohérents
// avec les clés utilisées pour choisir la page de détail (ex: "dramas" vs
// "drama"). On normalise pour que le clic sur un
// résultat de recherche ou une carte mène TOUJOURS à la bonne fiche.
const TYPE_ROUTE = {
  movie: "film", movies: "film", film: "film",
  series: "serie", serie: "serie",
  anime: "anime", animes: "anime",
  drama: "drama", dramas: "drama",
};
function detailRoute(item) {
  const raw = (item && item.type ? String(item.type) : "").toLowerCase().trim();
  return TYPE_ROUTE[raw] || TYPE_ROUTE[raw.replace(/s$/, "")] || "film";
}

const WARN_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M10.3 3.6 1.8 18a1.6 1.6 0 0 0 1.4 2.4h17.6a1.6 1.6 0 0 0 1.4-2.4L13.7 3.6a1.6 1.6 0 0 0-2.8 0Z"/><path d="M12 16.2h.01"/></svg>`;

function showRetryBanner(message, onRetry) {
  const old = document.getElementById("retry-banner");
  if (old) old.remove();
  const banner = document.createElement("div");
  banner.id = "retry-banner";
  banner.className = "retry-banner";
  banner.innerHTML = `<span class="retry-banner-msg">${WARN_ICON}${message || "Erreur de connexion à la source."}</span><button type="button">Réessayer</button>`;
  banner.querySelector("button").onclick = () => { banner.remove(); if (onRetry) onRetry(); };
  document.body.prepend(banner);
}
function showError(message, homeRoute) {
  const app = document.getElementById("app");
  if (!app) return;
  const home = homeRoute || (PUBLIC_ROUTES.includes(currentRoute().path) ? "index" : "catalogue");
  app.innerHTML = `
    <div class="error-box">
      <div class="error-icon">${WARN_ICON}</div>
      <h2>Une erreur est survenue</h2>
      <p>${message}</p>
      <a class="btn" onclick="nav('${home}')">Retour au catalogue</a>
    </div>`;
}
function doSearchFrom(inputId = "searchInput") {
  const el = document.getElementById(inputId);
  const q = el.value.trim();
  if (q.length < 2) return alert("Minimum 2 caractères");
  nav(`recherche?q=${encodeURIComponent(q)}`);
}
function cardBadgeClass(v) { return v === "VOSTFR" ? "vostfr" : v === "TrueFrench" ? "truefrench" : ""; }

const allItemsBySlug = {};
function trackItems(items) { (items || []).forEach(i => { if (i && i.slug) allItemsBySlug[i.slug] = i; }); }

function bindHearts(scope) {
  scope.querySelectorAll(".mylist-heart").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      const slug = btn.dataset.slug;
      const item = allItemsBySlug[slug];
      if (!item) return;
      const added = toggleMyList(item);
      document.querySelectorAll(`.mylist-heart[data-slug="${CSS.escape(slug)}"]`).forEach(b => {
        b.classList.toggle("active", added);
        b.textContent = added ? "♥" : "♡";
      });
    });
  });
}

function cardHtml(item, size /* "grid" | "row" */) {
  const route = detailRoute(item);
  const badgeClass = cardBadgeClass(item.version);
  const inList = isInMyList(item.slug);
  const epTag = item.latest_episode || "";
  const cls = size === "row" ? "row-card" : "card";
  return `
    <div class="${cls}" title="${item.title}">
      <button type="button" class="mylist-heart ${inList ? "active" : ""}" data-slug="${item.slug}" aria-label="Ma Liste">${inList ? "♥" : "♡"}</button>
      <a onclick="nav('${route}?slug=${encodeURIComponent(item.slug)}')">
        <img src="${item.image}" alt="${item.title}" loading="lazy"
             data-orig="${encodeURIComponent(item.image)}" data-retried="0" onerror="imgFallback(this)">
        <span class="type-chip">${typeLabel(item)}</span>
        ${itemRating(item) ? `<span class="rate-chip">${itemRating(item)}</span>` : ""}
        <span class="badge ${badgeClass} row-card-badge">${item.version || ""}</span>
        ${size !== "row" && epTag ? `<span class="tag card-ep-tag">${epTag}</span>` : ""}
      </a>
    </div>`;
}

/* =========================================================
   CHROME : en-tête (logo + recherche + compte) + barre du bas
   ========================================================= */
const NAV_ICONS = {
  home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>`,
  grid: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>`,
  heart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.1 2 4.5 5.6 4c2-.3 3.9.6 5 2.2C11.7 4.6 13.6 3.7 15.6 4c3.6.5 5.2 4.1 3.6 7.7C21 16.4 12 21 12 21Z"/></svg>`,
  gear: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>`,
};
const NAV_ICONS_EXTRA = {
  film: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>`,
  tv: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="m8 3 4 4 4-4"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`,
};
const catTab = () => getParam("tab") || "movies";
const BOTTOM_NAV_ITEMS = [
  { go: "accueil", label: "Accueil", icon: NAV_ICONS.home, active: (r) => r === "accueil" },
  { go: "recherche", label: "Explorer", icon: NAV_ICONS.search, active: (r) => r === "recherche" },
  { go: "catalogue?tab=movies", label: "Films", icon: NAV_ICONS_EXTRA.film, active: (r) => r === "film" || (r === "catalogue" && catTab() === "movies") },
  { go: "catalogue?tab=series", label: "Séries", icon: NAV_ICONS_EXTRA.tv, active: (r) => r === "serie" || (r === "catalogue" && catTab() === "series") },
  { go: "maliste", label: "Ma liste", icon: NAV_ICONS_EXTRA.plus, active: (r) => r === "maliste" },
];
function pillNavHtml(route) {
  const pills = [BOTTOM_NAV_ITEMS[0], BOTTOM_NAV_ITEMS[2], BOTTOM_NAV_ITEMS[3], BOTTOM_NAV_ITEMS[4]];
  return `<nav class="pillnav" aria-label="Navigation principale">${pills.map(it =>
    `<a onclick="nav('${it.go}')" class="${it.active(route) ? "active" : ""}">${it.label}</a>`).join("")}</nav>`;
}

function renderChrome() {
  const route = currentRoute().path;
  const header = document.getElementById("siteHeader");
  const loggedIn = getCurrentUser() && isLoggedIn();

  if (route === "index") {
    header.innerHTML = "";
    document.body.classList.remove("has-bottom-nav");
    const old = document.getElementById("bottomNav");
    if (old) old.remove();
    return;
  }

  // Header transparent superposé au hero façon Netflix sur l'accueil tant
  // qu'on n'a pas scrollé, puis opaque ensuite (et toujours opaque ailleurs).
  header.classList.toggle("transparent-header", false);

  // BUGFIX : la page Recherche a déjà sa propre grande barre de recherche —
  // on masque celle du header sur cette route pour ne pas en avoir deux.

      <span class="search-icon" onclick="if (window.innerWidth <= 760) nav('recherche')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
      <input id="headerSearchInput" type="text" placeholder="Rechercher un titre...">
    </div>` : ""}
    <div id="accountMenu" class="account-menu"></div>
  `;

  if (showSearch) {
    document.getElementById("headerSearchInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") doSearchFrom("headerSearchInput");
    });
  }

  const user = getCurrentUser();
  const menu = document.getElementById("accountMenu");
  if (loggedIn) {
    const initiale = (user.prenom || "?").charAt(0).toUpperCase();
    menu.innerHTML = `
      <button type="button" class="account-avatar" id="accountToggle">${initiale}</button>
      <div class="account-dropdown" id="accountDropdown">
        <div class="account-dropdown-name">${user.prenom || ""} ${user.nom || ""}</div>
        <div class="account-dropdown-sub">${user.email || ""}</div>
        <div class="account-dropdown-sub">${user.telephone || ""}</div>
        <button type="button" onclick="nav('parametres')">Paramètres</button>
        <button type="button" id="logoutBtn">Déconnexion</button>
      </div>`;
    const toggle = document.getElementById("accountToggle");
    const dropdown = document.getElementById("accountDropdown");
    toggle.addEventListener("click", (e) => { e.stopPropagation(); dropdown.classList.toggle("open"); });
    document.addEventListener("click", () => dropdown.classList.remove("open"), { once: true });
    document.getElementById("logoutBtn").addEventListener("click", logoutUser);
  } else {
    menu.innerHTML = `
      <a class="account-link" onclick="nav('connexion')">Connexion</a>
      <a class="btn account-btn-signup" onclick="nav('inscription')">S'inscrire</a>`;
  }

  // barre du bas façon appli mobile
  if (loggedIn) {
    let bn = document.getElementById("bottomNav");
    if (!bn) {
      bn = document.createElement("nav");
      bn.id = "bottomNav";
      bn.className = "bottom-nav";
      document.body.appendChild(bn);
      document.body.classList.add("has-bottom-nav");
    }
    bn.innerHTML = BOTTOM_NAV_ITEMS.map(it =>
      `<a onclick="nav('${it.go}')" class="${it.active(route) ? "active" : ""}">${it.icon}<span>${it.label}</span></a>`
    ).join("");
  } else {
    const bn = document.getElementById("bottomNav");
    if (bn) bn.remove();
    document.body.classList.remove("has-bottom-nav");
  }
}

// Mur d'affiches : 4 colonnes qui défilent lentement. Sans images (API
// injoignable), on affiche des tuiles colorées pour que la page reste belle.
function wallHtml(images) {
  const COLS = 4, PER = 7;
  const tile = (m, i) => m
    ? `<div class="tile"><img src="${escHtml(m.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-orig="${encodeURIComponent(m.image)}" data-retried="0" onerror="imgFallback(this)"></div>`
    : `<div class="tile ph" style="--hue:${(i * 47) % 360}"></div>`;
  let html = "";
  for (let c = 0; c < COLS; c++) {
    const list = Array.from({ length: PER }, (_, k) => images.length ? images[(c * PER + k) % images.length] : null);
    const tiles = list.map((m, k) => tile(m, c * PER + k)).join("");
    html += `<div class="wall-col c${c}"><div class="wall-track">${tiles}${tiles}</div></div>`;
  }
  return html;
}

const HOME_SECTIONS = [
  { key: "movies", title: "Films", tab: "movies" },
  { key: "series", title: "Séries", tab: "series" },
  { key: "anime", title: "Animés", tab: "anime" },
  { key: "dramas", title: "K-Dramas", tab: "dramas" },
];

/* ---------------------------------------------------------
   ANNONCE en haut de l'accueil (bandeau "à l'affiche").
   - slug vide  : on annonce automatiquement le 1er film du catalogue.
   - slug rempli: on annonce ce titre précis (type : "movies", "series",
                  "anime" ou "dramas"), ex. { type: "movies", slug: "mon-film" }.
   - actif: false pour masquer le bandeau.
   --------------------------------------------------------- */
const ANNONCE = {
  actif: true,
  type: "movies",
  slug: "",
  etiquette: "À L'AFFICHE",
  texte: "À voir dès maintenant sur PRINCE MOVIE",
};

const STAGE_PER_SECTION = 2;   // nb de titres par catégorie dans le carrousel
const STAGE_DELAY_MS = 7000;   // durée d'affichage de chaque diapositive
let stageTimer = null;
function stopStage() { if (stageTimer) { clearInterval(stageTimer); stageTimer = null; } }

const TYPE_LABEL = { film: "FILM", serie: "SÉRIE", anime: "ANIMÉ", drama: "K-DRAMA" };
function typeLabel(item) { return TYPE_LABEL[detailRoute(item)] || "FILM"; }
function itemRating(item) {
  const v = Number(item && (item.rating ?? item.score ?? item.note ?? item.vote_average));
  return Number.isFinite(v) && v > 0 ? v.toFixed(1) : "";
}
function escHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function imgTag(item, cls, eager) {
  return `<img class="${cls}" src="${escHtml(item.image)}" alt="" ${eager ? "" : 'loading="lazy"'} referrerpolicy="no-referrer"
    data-orig="${encodeURIComponent(item.image || "")}" data-retried="0" onerror="imgFallback(this)">`;
}

function slideHtml(item, i) {
  const route = detailRoute(item);
  const rating = itemRating(item);
  const go = `nav('${route}?slug=${encodeURIComponent(item.slug)}')`;
  const inList = isInMyList(item.slug);
  return `
    <article class="slide ${i === 0 ? "on" : ""}" aria-hidden="${i === 0 ? "false" : "true"}">
      ${imgTag(item, "slide-bg", i === 0)}
      <div class="slide-shade"></div>
      ${imgTag(item, "slide-poster", i === 0)}
      <div class="slide-copy">
        <span class="kicker">Sélection PRINCE MOVIE</span>
        <div class="chips">
          <span class="chip-t">${typeLabel(item)}</span>
          ${item.year ? `<span class="chip-t">${escHtml(item.year)}</span>` : ""}
          ${rating ? `<span class="chip-t chip-star">★ ${rating}</span>` : ""}
          ${item.version ? `<span class="chip-t">${escHtml(item.version)}</span>` : ""}
        </div>
        <h1>${escHtml(item.title)}</h1>
        <p>${escHtml(item.synopsis || "Découvre ce titre en streaming sur PRINCE MOVIE.")}</p>
        <div class="slide-actions">
          <a class="btn" onclick="${go}"><span aria-hidden="true">▶</span> Plus d'infos</a>
          <button type="button" class="btn-ghost slide-list" data-slug="${escHtml(item.slug)}">${inList ? "✓ Dans ma liste" : "＋ Ma liste"}</button>
        </div>
      </div>
    </article>`;
}

function renderStage(items) {
  stopStage();
  const el = document.getElementById("hero");
  if (!items.length) { el.className = ""; el.innerHTML = ""; return; }
  trackItems(items);
  el.className = "stage";
  el.innerHTML = `
    <div class="stage-slides">${items.map(slideHtml).join("")}</div>
    <div class="stage-ctrl" role="group" aria-label="Carrousel">
      <button type="button" class="stage-arrow" data-dir="-1" aria-label="Précédent">‹</button>
      <div class="stage-dots">${items.map((_, i) => `<button type="button" class="stage-dot ${i === 0 ? "on" : ""}" data-i="${i}" aria-label="Diapositive ${i + 1}"></button>`).join("")}</div>
      <button type="button" class="stage-arrow" data-dir="1" aria-label="Suivant">›</button>
    </div>`;

  const slides = [...el.querySelectorAll(".slide")];
  const dots = [...el.querySelectorAll(".stage-dot")];
  let idx = 0;
  const show = (n) => {
    idx = (n + slides.length) % slides.length;
    slides.forEach((s, i) => { s.classList.toggle("on", i === idx); s.setAttribute("aria-hidden", i === idx ? "false" : "true"); });
    dots.forEach((d, i) => d.classList.toggle("on", i === idx));
  };
  const restart = () => {
    stopStage();
    if (slides.length < 2) return;
    stageTimer = setInterval(() => {
      if (!document.body.contains(el.querySelector(".stage-slides"))) { stopStage(); return; }
      if (!document.hidden) show(idx + 1);
    }, STAGE_DELAY_MS);
  };

  el.querySelectorAll(".stage-arrow").forEach(b => { b.onclick = () => { show(idx + Number(b.dataset.dir)); restart(); }; });
  dots.forEach(d => { d.onclick = () => { show(Number(d.dataset.i)); restart(); }; });
  el.querySelectorAll(".slide-list").forEach(btn => {
    btn.onclick = () => {
      const item = allItemsBySlug[btn.dataset.slug];
      if (!item) return;
      const added = toggleMyList(item);
      btn.textContent = added ? "✓ Dans ma liste" : "＋ Ma liste";
    };
  });

  // Balayage tactile + pause au survol
  let x0 = null;
  el.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  el.addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if (Math.abs(dx) > 50) { show(idx + (dx < 0 ? 1 : -1)); restart(); }
  }, { passive: true });
  el.addEventListener("mouseenter", stopStage);
  el.addEventListener("mouseleave", restart);
  restart();
}

// Détermine le titre à annoncer (titre précis demandé, sinon repli fourni).
async function resolveAnnonce(fallbackItem) {
  if (!ANNONCE.actif) return null;
  if (ANNONCE.slug) {
    try {
      const { data } = await api(`/${ANNONCE.type}/${ANNONCE.slug}`);
      if (data && data.title && data.image) return { ...data, slug: data.slug || ANNONCE.slug, type: data.type || ANNONCE.type };
    } catch (e) { console.error("Annonce introuvable, repli automatique :", e); }
  }
  return fallbackItem || null;
}

function showAnnonce(item) {
  const box = document.getElementById("announce");
  if (!box) return;
  box.innerHTML = "";
  if (!item) return;
  let dismissed = "";
  try { dismissed = sessionStorage.getItem("pm_annonce_off") || ""; } catch (e) {}
  if (dismissed === item.slug) return;
  trackItems([item]);
  const go = `nav('${detailRoute(item)}?slug=${encodeURIComponent(item.slug)}')`;
  box.innerHTML = `
    <div class="announce" role="region" aria-label="Annonce">
      <span class="announce-tag">✦ ${escHtml(ANNONCE.etiquette)}</span>
      ${imgTag(item, "announce-thumb", true)}
      <div class="announce-text">
        <strong>${escHtml(item.title)}</strong>
        <span>${escHtml(ANNONCE.texte)}</span>
      </div>
      <a class="announce-cta" onclick="${go}">Regarder</a>
      <button type="button" class="announce-x" aria-label="Fermer l'annonce">×</button>
    </div>`;
  box.querySelector(".announce-x").onclick = () => {
    try { sessionStorage.setItem("pm_annonce_off", item.slug); } catch (e) {}
    box.innerHTML = "";
  };
}

function rankRowHtml(items) {
  return items.slice(0, 10).map((it, i) =>
    `<div class="rank-item"><span class="rank-num" aria-hidden="true">${i + 1}</span>${cardHtml(it, "row")}</div>`

}

function rowBlock({ kicker, title, tab, inner }) {
  const block = document.createElement("div");
  block.className = "row-block";
