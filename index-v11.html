async function viewAccueil() {
  document.body.classList.remove("welcome-body");
  const heroEl = document.getElementById("hero");
  heroEl.className = ""; heroEl.innerHTML = "";
  document.getElementById("app").innerHTML = `<main class="rows-wrap" id="rows"><div class="loader">Chargement</div></main>`;
  const rowsEl = document.getElementById("rows");

  // Si l'utilisateur change de page pendant le chargement, on abandonne
  // silencieusement pour ne rien écrire au mauvais endroit.
  const startHash = location.hash;
  const stillOnThisPage = () => location.hash === startHash;

  const results = await Promise.allSettled(HOME_SECTIONS.map((s, i) =>
    new Promise(r => setTimeout(r, i * 120)).then(() => api(`/${s.tab}`, { page: 1 }))
  ));
  if (!stillOnThisPage()) return;
  rowsEl.innerHTML = "";

  const loaded = {};
  results.forEach((res, i) => {
    const s = HOME_SECTIONS[i];
    if (res.status !== "fulfilled") { console.error(`Erreur sur ${s.key} :`, res.reason); return; }
    const data = res.value && res.value.data;
    if (data && data.length) { loaded[s.key] = data; trackItems(data); }
  });

  const myList = getMyList();
  if (!Object.keys(loaded).length && !myList.length) {
    rowsEl.innerHTML = `
      <div class="error-box">
        <div class="error-icon">${WARN_ICON}</div>
        <h2>Une erreur est survenue</h2>
        <p>Impossible de charger le catalogue pour le moment.</p>
        <button class="btn" onclick="renderApp()">Réessayer</button>
      </div>`;
    return;
  }

  // Annonce + carrousel (l'annonce n'est pas répétée dans le carrousel)
  const first = (loaded.movies && loaded.movies[0]) || Object.values(loaded)[0]?.[0] || null;
  const announceItem = await resolveAnnonce(first);
  if (!stillOnThisPage()) return;
  showAnnonce(announceItem);

  const pool = [];
  for (let k = 0; k < STAGE_PER_SECTION; k++) {
    HOME_SECTIONS.forEach(s => {
      const it = (loaded[s.key] || [])[k];
      if (!it || (announceItem && it.slug === announceItem.slug) || pool.some(p => p.slug === it.slug)) return;
      pool.push(it);
    });
  }
  renderStage(pool.slice(0, 8));

  // Rangées
  if (loaded.movies) {
    rowsEl.appendChild(rowBlock({ kicker: "Tendances", title: "Le Top 10 du moment", inner: rankRowHtml(loaded.movies) }));
  }
  if (myList.length) {
    trackItems(myList);
    rowsEl.appendChild(rowBlock({ title: "Ma Liste", inner: myList.map(i => cardHtml(i, "row")).join("") }));
  }
  HOME_SECTIONS.forEach(s => {
    let data = loaded[s.key];
    if (s.key === "movies" && data) data = data.slice(10);   // les 10 premiers sont déjà dans le Top 10
    if (!data || !data.length) return;
    rowsEl.appendChild(rowBlock({ title: s.key === "movies" ? "Plus de films" : s.title, tab: s.tab, inner: data.map(i => cardHtml(i, "row")).join("") }));
  });
  bindHearts(rowsEl);
}

const CATALOGUE_TITLES = { movies: "Films", series: "Séries", anime: "Animés", dramas: "K-Dramas" };
let catState = { tab: "movies", page: 1, hasContent: false, seq: 0 };

function viewCatalogue() {
  document.getElementById("hero").innerHTML = "";
  document.getElementById("hero").className = "";
  document.body.classList.remove("welcome-body");
  const validTabs = Object.keys(CATALOGUE_TITLES);
  const tabParam = getParam("tab");
  catState = { tab: validTabs.includes(tabParam) ? tabParam : "movies", page: 1, hasContent: false, seq: catState.seq };

  document.getElementById("app").innerHTML = `
    <main class="has-chips">
      <div class="chip-row" id="chipRow">
        ${validTabs.map(t => `<button type="button" class="chip ${t === catState.tab ? "active" : ""}" data-tab="${t}">${CATALOGUE_TITLES[t]}</button>`).join("")}
      </div>
      <h1 class="section-title sr-only" id="catTitle">${CATALOGUE_TITLES[catState.tab]}</h1>
      <div id="catApp"><div class="loader">Chargement</div></div>
      <div class="pagination" id="catPagination"></div>
    </main>`;

  document.querySelectorAll("#chipRow .chip").forEach(chip => {
    chip.onclick = () => {
      document.querySelectorAll("#chipRow .chip").forEach(x => x.classList.remove("active"));
      chip.classList.add("active");
      catState.tab = chip.dataset.tab;
      catState.page = 1;
      catState.hasContent = false;
      document.getElementById("catTitle").textContent = CATALOGUE_TITLES[catState.tab];
      loadCatalogueTab();
    };
  });

  loadCatalogueTab();
}

async function loadCatalogueTab() {
  const app = document.getElementById("catApp");
  const pag = document.getElementById("catPagination");
  const mySeq = ++catState.seq;
  if (!catState.hasContent) { app.innerHTML = `<div class="loader">Chargement</div>`; pag.innerHTML = ""; }
  try {
    const json = await api(`/${catState.tab}`, { page: catState.page });
    if (mySeq !== catState.seq) return;
    catState.hasContent = true;
    renderCatalogueGrid(json.data);
    renderCataloguePagination(json.meta);
  } catch (e) {
    if (mySeq !== catState.seq) return;
    console.error("Erreur :", e);
    if (catState.hasContent) showRetryBanner("Impossible de charger cette page. " + e.message, loadCatalogueTab);
    else showError(e.message);
  }
}
function renderCatalogueGrid(items) {
  const app = document.getElementById("catApp");
  if (!items || !items.length) { app.innerHTML = "<p>Aucun résultat.</p>"; return; }
  trackItems(items);
  app.innerHTML = `<div class="grid">` + items.map(i => cardHtml(i, "grid")).join("") + `</div>`;
  bindHearts(app);
}
function renderCataloguePagination(meta) {
  const pag = document.getElementById("catPagination");
  if (!meta || meta.last_page <= 1) { pag.innerHTML = ""; return; }
  const total = meta.last_page, p = catState.page;
  let html = `<button ${p === 1 ? "disabled" : ""} onclick="goCataloguePage(${p - 1})">« Précédent</button>`;
  const start = Math.max(1, p - 2), end = Math.min(total, p + 2);
  for (let i = start; i <= end; i++) html += `<button class="${i === p ? "active" : ""}" onclick="goCataloguePage(${i})">${i}</button>`;
  html += `<button ${p === total ? "disabled" : ""} onclick="goCataloguePage(${p + 1})">Suivant »</button>`;
  pag.innerHTML = html;
}
function goCataloguePage(p) { catState.page = p; loadCatalogueTab(); window.scrollTo({ top: 0, behavior: "smooth" }); }

// BUGFIX : le bouton "Regarder" ne s'affichait plus dès que le champ
// "first_episode_id" était absent de la réponse API (variable selon les
// titres). On essaie plusieurs noms de champ possibles, et si aucun n'est
// présent on route quand même vers le lecteur avec le "slug" : le lecteur
// sait alors interroger l'endpoint "/servers" du titre directement.
function resolvePlayId(obj) {
  return obj.first_episode_id || obj.episode_id || obj.video_id || obj.play_id || null;
}

function detailChrome() { document.getElementById("hero").innerHTML = ""; document.getElementById("hero").className = ""; document.body.classList.remove("welcome-body"); }

// BUGFIX : la bannière "backdrop" des fiches détail utilise une image de
// fond CSS, qui ne déclenche pas d'événement onerror — donc le même souci
// de contenu mixte (HTTPS -> image HTTP) la laissait invisible sans aucun
// repli. On teste le chargement via un objet Image() et on bascule sur les
// proxys au besoin, comme pour les autres images du site.
function loadBackdrop(url) {
  const el = document.querySelector(".dhero");
  if (!el || !url) return;
  const attempts = [url, ...PROXIES.map(p => p + encodeURIComponent(url))];
  let i = 0;
  const tryNext = () => {
    if (i >= attempts.length || !document.body.contains(el)) return;
    const probe = new Image();
    probe.onload = () => { el.style.backgroundImage = `url('${attempts[i]}')`; };
    probe.onerror = () => { i++; tryNext(); };
    probe.src = attempts[i];
  };
  tryNext();
}

const PLAY_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z" fill="currentColor" stroke="none"/></svg>`;

// BUGFIX : selon les titres, l'API renvoie soit un tableau plat "episodes"
// (chaque épisode ayant un champ "season"), soit un tableau "seasons" où
// chaque saison contient elle-même sa propre liste d'épisodes. Le code ne
// gérait que le premier cas — les séries au format "seasons" n'affichaient
// donc AUCUN épisode. On aplati les deux formats vers la même forme avant
// de les passer à episodesBySeasonHtml.
function normalizeEpisodesData(data) {
  if (Array.isArray(data.episodes) && data.episodes.length) return data.episodes;
  if (Array.isArray(data.seasons) && data.seasons.length) {
    const flat = [];
    data.seasons.forEach(season => {
      const seasonNumber = season.season ?? season.number ?? season.season_number ?? "1";
      (season.episodes || []).forEach(ep => flat.push({ ...ep, season: ep.season ?? seasonNumber }));
    });
    return flat;
  }
  return [];
}

// Liste d'épisodes groupés par saison, avec sélecteur de saison façon
// Netflix (masqué automatiquement s'il n'y a qu'une seule saison — ce qui
// couvre aussi les animés/K-dramas sans découpage en saisons).
function episodesBySeasonHtml(episodes, hrefBuilder) {
  episodes = episodes || [];
  if (!episodes.length) return `<p style="color:var(--text-muted)">Aucun épisode disponible.</p>`;
  const seasons = {};
  episodes.forEach(ep => { const n = ep.season || "1"; (seasons[n] = seasons[n] || []).push(ep); });
  const seasonKeys = Object.keys(seasons).sort((a, b) => +a - +b);
  const uid = "eplist_" + Math.random().toString(36).slice(2, 8);

  const renderList = (key) => `<div class="ep-rows">${(seasons[key] || []).map(ep => `
    <a class="ep-row" onclick="nav('${hrefBuilder(ep)}')">
      <div class="ep-num">${ep.number ?? "•"}</div>
      <div class="ep-info">
        <div class="ep-title">${ep.title || "Épisode " + ep.number}</div>
        ${ep.version ? `<div class="ep-sub">${ep.version}</div>` : ""}
      </div>
      <div class="ep-play">${PLAY_ICON_SVG}</div>
    </a>`).join("")}</div>`;

  window[uid] = renderList;
  const selectHtml = seasonKeys.length > 1 ? `
    <div class="season-select-wrap">
      <select class="season-select" onchange="document.getElementById('${uid}_list').innerHTML = window['${uid}'](this.value)">
        ${seasonKeys.map(k => `<option value="${k}">Saison ${k}</option>`).join("")}
      </select>
    </div>` : "";

  return `
    <div class="detail-body-head">
      <h1 class="section-title" style="margin-bottom:0">Épisodes (${episodes.length})</h1>
      ${selectHtml}
    </div>
    <div id="${uid}_list">${renderList(seasonKeys[0])}</div>`;
}

// BUGFIX : le site tourne en HTTPS mais les images de l'API sont servies en
// HTTP — c'est du "contenu mixte" que Chrome bloque silencieusement (l'image
// ne s'affiche juste pas, aucune erreur visible). On applique le même repli (recharger via un proxy, qui lui
// sert bien la ressource en HTTPS) à TOUTES les images du site : cartes de
// catalogue/accueil/Ma Liste, titres similaires, bannière d'accueil, etc.
function imgFallback(img) {
  const tried = Number(img.dataset.retried || 0);
  if (tried >= PROXIES.length) {
    img.onerror = null;
    img.src = "data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22300%22%3E%3Crect fill=%22%23222%22 width=%22200%22 height=%22300%22/%3E%3C/svg%3E";
    return;
  }
  const orig = decodeURIComponent(img.dataset.orig || encodeURIComponent(img.src));
  img.dataset.orig = encodeURIComponent(orig);
  img.dataset.retried = String(tried + 1);
  img.src = PROXIES[tried] + encodeURIComponent(orig);
}
/* ----- Lecteur vidéo ----- */
async function viewLecteur() {
  detailChrome();
  const id = getParam("id");
  const type = getParam("type");
  const slug = getParam("slug");
  const episode = getParam("episode");
  const title = getParam("title") || "Lecture";
  document.title = `${title} — PRINCE MOVIE`;
  document.getElementById("app").innerHTML = `<main>
    <h1 class="section-title" id="lecteurTitle">${title}</h1>
    <div class="player-wrap" id="player"><div class="loader" style="padding:200px 0">Chargement du lecteur</div></div>
    <div class="servers-tabs" id="tabs"></div>
    <p id="fallbackLink" style="text-align:center;margin-top:14px;font-size:14px;color:var(--text-muted)"></p>
    <section class="similar-section" id="similar"></section>
  </main>`;
  loadSimilar(type, slug);

  let servers = [];
  try {
    let data;
    if (type === "anime") {
      ({ data } = await api(`/anime/${slug}/servers`, { episode }));
    } else if (type === "dramas") {
      ({ data } = await api(`/dramas/${slug}/servers`, { episode }));
    } else if (id) {
      // BUGFIX : si l'id d'épisode fourni échoue (mauvais champ côté fiche
      // film/série), on retombe sur l'endpoint "/servers" du titre lui-même.
      try {
        ({ data } = await api(`/episodes/${id}/servers`));
      } catch (e) {
        if (slug && (type === "movies" || type === "series")) {
          ({ data } = await api(`/${type}/${slug}/servers`));
        } else {
          throw e;
        }
      }
    } else if (slug && (type === "movies" || type === "series")) {
      ({ data } = await api(`/${type}/${slug}/servers`));
    } else {
      throw new Error("Aucun épisode spécifié.");
    }

    servers = data;
    if (!servers || !servers.length) {
      document.getElementById("player").innerHTML = `<div class="error-box"><p>Aucun serveur disponible.</p></div>`;
      return;
    }
    renderServerTabs(servers);
    switchServer(0, servers);
  } catch (e) {
    document.getElementById("player").innerHTML = `<div class="error-box"><h2>😕 Erreur</h2><p>${e.message}</p></div>`;
  }
}
// Titres similaires sous le lecteur : on utilise "related" de la fiche si
// l'API en fournit, sinon on complète avec le reste de la même catégorie.
async function loadSimilar(type, slug) {
  const startHash = location.hash;
  const done = (html) => {
    const box = document.getElementById("similar");
    if (!box || location.hash !== startHash) return null;
    box.innerHTML = html;
    return box;
  };
  if (!type || !slug || !["movies", "series", "anime", "dramas"].includes(type)) return;
  let items = [];
  try {
    const { data } = await api(`/${type}/${slug}`);
    if (data && Array.isArray(data.related)) items = data.related.map(r => ({ ...r, type: r.type || type }));
  } catch (e) { console.error("Titres similaires (fiche) :", e); }
  if (items.length < 8) {
    try {
      const { data } = await api(`/${type}`, { page: 1 });
      items = items.concat((data || []).map(r => ({ ...r, type: r.type || type })));
    } catch (e) { console.error("Titres similaires (catégorie) :", e); }
  }
  const seen = new Set([slug]);
  items = items.filter(r => r && r.slug && r.image && !seen.has(r.slug) && seen.add(r.slug)).slice(0, 14);
  if (!items.length) return;
  trackItems(items);
  const box = done(`
    <div class="row-head"><div><span class="kicker">Tu aimeras aussi</span><h2>Titres similaires</h2></div></div>
    <div class="row-scroll">${items.map(i => cardHtml(i, "row")).join("")}</div>`);
  if (box) bindHearts(box);
}
function renderServerTabs(servers) {
  document.getElementById("tabs").innerHTML = servers.map((s, i) => `
    <button type="button" class="server-btn" onclick="switchServer(${i}, window.__pmServers)">${s.server_name} <small>(${s.version})</small></button>`).join("");
  window.__pmServers = servers;
}
function switchServer(i, servers) {
  servers = servers || window.__pmServers;
  document.querySelectorAll(".server-btn").forEach((b, idx) => b.classList.toggle("active", idx === i));
  const originalLink = servers[i].server_link;
  let link = originalLink;
  if (location.protocol === "https:" && link.startsWith("http://")) link = "https://" + link.slice("http://".length);
  // BUGFIX : certains hébergeurs de lecteurs affichent un mur "Checking
  // your browser..." (anti-bot) qui ne se termine jamais quand la requête
  // n'a pas de referrer, ou quand la sandbox de l'iframe l'empêche de se
  // recharger / poser un cookie après la vérification — d'où allow-scripts,
  // allow-same-origin, allow-forms et un referrer non vide ci-dessus.
  // BUGFIX (pubs) : c'est justement allow-popups / allow-popups-to-escape-
  // sandbox / allow-top-navigation-by-user-activation qui laissent passer
  // les popunders et redirections publicitaires de ces hébergeurs gratuits.
  // On les retire : la vérification anti-bot n'en a pas besoin (elle recharge
  // l'iframe elle-même, pas la page du dessus), alors que les pubs, si.
  document.getElementById("player").innerHTML = `<iframe src="${link}" allowfullscreen allow="autoplay; fullscreen; picture-in-picture; encrypted-media" referrerpolicy="origin" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"></iframe>`;
  document.getElementById("fallbackLink").innerHTML =
    `Le lecteur ne s'affiche pas ? <a href="${originalLink}" target="_blank" rel="noopener noreferrer" style="color:var(--accent);font-weight:700">Ouvrir dans un nouvel onglet</a>`;
}

    document.getElementById(id).addEventListener("change", () => {
      localStorage.setItem("pm_prefs", JSON.stringify({
        autoplay: document.getElementById("prefAutoplay").checked,
        notif: document.getElementById("prefNotif").checked,
        subs: document.getElementById("prefSubs").checked,
      }));
    });
  });
  document.getElementById("logoutBtn").addEventListener("click", logoutUser);
}

/* =========================================================
   ROUTEUR PRINCIPAL
   ========================================================= */
const ROUTES = {
  index: viewIndex, connexion: viewConnexion, inscription: viewInscription,
  // BUGFIX : "accueil" (ancienne page d'accueil séparée) n'est plus une
  // option du site — tout pointe maintenant vers "catalogue" (Parcourir),
  // y compris les vieux liens/favoris qui pointeraient encore vers #/accueil.
  accueil: viewAccueil, catalogue: viewCatalogue, recherche: viewRecherche,
  film: viewFilm, serie: viewSerie, anime: viewAnime, drama: viewDrama,
  lecteur: viewLecteur, maliste: viewMaliste, parametres: viewParametres,
};

function renderApp() {
  const { path } = currentRoute();
  window.scrollTo({ top: 0 });

  // Garde d'accès : les routes non publiques nécessitent d'être connecté.
  if (!PUBLIC_ROUTES.includes(path) && !(getCurrentUser() && isLoggedIn())) {
    if (location.hash !== "#/index") { location.hash = "#/index"; return; }
  }
  // BUGFIX : la page de bienvenue ("index") ne redirige plus jamais
  // automatiquement vers le catalogue, même si l'utilisateur est déjà
  // connecté. Le site doit toujours pouvoir afficher cette page (elle sert
  // de page d'atterrissage, comme sur Netflix) ; c'est viewIndex() qui
  // adapte son contenu (bouton "Continuer" vs formulaire d'inscription)
  // selon l'état de connexion.

  stopStage();
  document.body.classList.remove("auth-body");
  if (path !== "accueil") { const an = document.getElementById("announce"); if (an) an.innerHTML = ""; }
  renderChrome();
  const view = ROUTES[path] || viewCatalogue;
  // Filet de sécurité : si une vue lève une erreur inattendue de façon
  // synchrone (donnée manquante, etc.), on affiche un message clair au
  // lieu de laisser la page blanche ("planter").
  try {
    const result = view();
    if (result && typeof result.catch === "function") {
      result.catch(err => {
        console.error("Erreur de vue :", err);
        showError(err && err.message ? err.message : "Une erreur inattendue est survenue.");
      });
    }
  } catch (err) {
    console.error("Erreur de vue :", err);
    showError(err && err.message ? err.message : "Une erreur inattendue est survenue.");
  }
}

window.addEventListener("error", (e) => {
  console.error("Erreur JS non gérée :", e.error || e.message);
});
// Header façon Netflix : transparent en haut de l'accueil, opaque dès qu'on scrolle.
window.addEventListener("scroll", () => {
  const header = document.getElementById("siteHeader");
  if (!header) return;
  header.classList.toggle("transparent-header", false);
}, { passive: true });
window.addEventListener("hashchange", renderApp);
window.addEventListener("DOMContentLoaded", renderApp);
</script>
