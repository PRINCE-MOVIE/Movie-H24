<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lecteur PRINCE MOVIE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0b0b0f;
        --panel: #12171f;
        --panel-2: #1b2230;
        --line: rgba(255,255,255,.08);
        --text: #f3f6fb;
        --muted: #a8b0c0;
        --red: #e50914;
        --gold: #f6d78b;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: linear-gradient(180deg, #0b0b0f, #111925);
        color: var(--text);
      }

      .reader-page {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      .reader-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .reader-title {
        margin: 0;
        font-size: clamp(1.4rem, 3vw, 2.2rem);
      }

      .reader-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      select, button {
        font: inherit;
      }

      select {
        min-width: 200px;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,.04);
        color: var(--text);
      }

      .reader-btn {
        padding: 10px 16px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,.04);
        color: var(--text);
      }

      .reader-btn.primary {
        background: linear-gradient(135deg, var(--red), #b00610);
        border-color: transparent;
      }

      .reader-panel {
        background: rgba(18, 23, 31, 0.9);
        border: 1px solid var(--line);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 18px 50px rgba(0,0,0,.3);
      }

      .reader-pages {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
        background: #000;
      }

      .reader-pages img {
        display: block;
        width: 100%;
        height: auto;
        background: #111;
        border-bottom: 1px solid rgba(255,255,255,.04);
      }

      .empty-state {
        padding: 60px 20px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 640px) {
        .reader-controls {
          width: 100%;
        }
        select {
          flex: 1;
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="reader-page">
      <div class="reader-header">
        <h1 id="reader-title" class="reader-title">Lecture</h1>
        <div class="reader-controls">
          <select id="chapter-select" aria-label="Choisir un chapitre"></select>
          <button id="prev-btn" class="reader-btn" type="button">← Précédent</button>
          <button id="next-btn" class="reader-btn primary" type="button">Suivant →</button>
        </div>
      </div>

      <div class="reader-panel">
        <div id="reader-pages" class="reader-pages"></div>
      </div>
    </div>

    <script>
      const API_BASE = 'http://51.75.118.170:20041/api/v1';
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      const title = params.get('title') || 'Lecture';
      const initialChapter = params.get('chapter') || '';
      const state = { slug, title, chapters: [], selectedIndex: 0 };

      const readerTitle = document.getElementById('reader-title');
      const chapterSelect = document.getElementById('chapter-select');
      const readerPages = document.getElementById('reader-pages');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');

      readerTitle.textContent = title;

      async function api(path) {
        const response = await fetch(`${API_BASE}${path}`);
        if (!response.ok) throw new Error('Erreur API');
        const json = await response.json();
        if (json && json.success === false) throw new Error(json.error?.message || 'Erreur API');
        return json;
      }

      async function loadChapters() {
        if (!slug) {
          readerPages.innerHTML = '<div class="empty-state">Aucun webtoon sélectionné.</div>';
          return;
        }

        try {
          const data = await api(`/webtoons/${encodeURIComponent(slug)}`);
          const item = data.data || data || {};
          const chapters = item.chapters || [];
          state.chapters = chapters;

          if (!chapters.length) {
            readerPages.innerHTML = '<div class="empty-state">Aucun chapitre disponible pour ce webtoon.</div>';
            return;
          }

          const startIndex = chapters.findIndex((chapter) => String(chapter.chapter_id || chapter.id) === String(initialChapter));
          state.selectedIndex = startIndex >= 0 ? startIndex : 0;
          renderChapterSelector();
          loadSelectedChapter();
        } catch (error) {
          readerPages.innerHTML = '<div class="empty-state">Le lecteur n’a pas pu ouvrir ce webtoon.</div>';
        }
      }

      function renderChapterSelector() {
        chapterSelect.innerHTML = state.chapters.map((chapter, index) => `
          <option value="${index}">${chapter.title || `Chapitre ${chapter.number || index + 1}`}</option>
        `).join('');
        chapterSelect.value = String(state.selectedIndex);
      }

      async function loadSelectedChapter() {
        const chapter = state.chapters[state.selectedIndex];
        if (!chapter) return;

        const chapterId = chapter.chapter_id || chapter.id;
        readerTitle.textContent = `${state.title} — ${chapter.title || `Chapitre ${chapter.number || state.selectedIndex + 1}`}`;
        chapterSelect.value = String(state.selectedIndex);
        prevBtn.disabled = state.selectedIndex <= 0;
        nextBtn.disabled = state.selectedIndex >= state.chapters.length - 1;

        readerPages.innerHTML = '<div class="empty-state">Chargement du chapitre...</div>';

        try {
          const data = await api(`/webtoons/${encodeURIComponent(state.slug)}/pages?chapter=${encodeURIComponent(chapterId)}`);
          const pages = data.data || data || [];

          if (!pages.length) {
            readerPages.innerHTML = '<div class="empty-state">Aucune page disponible pour ce chapitre.</div>';
            return;
          }

          readerPages.innerHTML = pages.map((page) => `<img src="${page.image}" alt="Page ${page.page || ''}" loading="lazy" />`).join('');
        } catch (error) {
          readerPages.innerHTML = '<div class="empty-state">Impossible de charger ce chapitre.</div>';
        }
      }

      chapterSelect.addEventListener('change', (event) => {
        state.selectedIndex = Number(event.target.value);
        loadSelectedChapter();
      });

      prevBtn.addEventListener('click', () => {
        if (state.selectedIndex > 0) {
          state.selectedIndex -= 1;
          loadSelectedChapter();
        }
      });

      nextBtn.addEventListener('click', () => {
        if (state.selectedIndex < state.chapters.length - 1) {
          state.selectedIndex += 1;
          loadSelectedChapter();
        }
      });

      loadChapters();
    </script>
  </body>
</html>
