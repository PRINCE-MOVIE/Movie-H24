<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d17" />
    <title>PRINCE MOVIE | Streaming premium</title>
    <style>
      :root {
        --bg: #080d17;
        --bg-soft: #111827;
        --panel: rgba(11, 17, 26, 0.9);
        --card: rgba(18, 25, 39, 0.92);
        --card-2: rgba(17, 24, 39, 0.9);
        --line: rgba(148, 163, 184, 0.18);
        --text: #edf3ff;
        --muted: #a7b0c0;
        --red: #ff3b57;
        --red-2: #ff7a59;
        --gold: #f4c96d;
        --green: #4ade80;
        --blue: #5aa9ff;
        --shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 15% 0%, rgba(255, 59, 87, 0.18), transparent 22%),
          radial-gradient(circle at 80% 10%, rgba(90, 169, 255, 0.12), transparent 18%),
          linear-gradient(180deg, #050b13 0%, #0c1320 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      a { color: inherit; text-decoration: none; }
      button, input, select { font: inherit; }
      img { display: block; max-width: 100%; }

      .app-shell {
        max-width: 1460px;
        margin: 0 auto;
        padding: 22px 16px 70px;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 18px 22px;
        margin-bottom: 22px;
        background: rgba(8, 13, 23, 0.72);
        border: 1px solid var(--line);
        border-radius: 18px;
        backdrop-filter: blur(18px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--red), var(--red-2));
        box-shadow: 0 18px 30px rgba(255, 59, 87, 0.35);
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 20px;
        color: var(--muted);
        font-weight: 700;
      }
      .nav a {
        padding: 8px 12px;
        border-radius: 10px;
        transition: 0.18s ease;
      }
      .nav a:hover, .nav a.active {
        background: rgba(255, 59, 87, 0.08);
        color: var(--text);
      }

      .header-tools {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 300px;
        padding: 10px 14px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.03);
      }
      .search-box input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
      }
      .search-box input::placeholder { color: var(--muted); }

      .lang-toggle,
      .ghost-btn,
      .primary-btn,
      .secondary-btn,
      .server-btn,
      .close-btn {
        border: none;
        cursor: pointer;
      }

      .lang-toggle,
      .ghost-btn {
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.03);
        color: var(--text);
      }

      .feature-hero {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 26px;
        align-items: center;
        min-height: 430px;
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background:
          linear-gradient(90deg, rgba(8, 13, 23, 0.9), rgba(8, 13, 23, 0.44)),
          url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
        box-shadow: var(--shadow);
      }

      .hero-copy {
        max-width: 620px;
      }
      .eyebrow {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255, 59, 87, 0.14);
        border: 1px solid rgba(255, 59, 87, 0.38);
        color: #ffbfd1;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        font-weight: 800;
        text-transform: uppercase;
      }
      .hero-copy h1 {
        margin: 18px 0 14px;
        font-size: clamp(2.6rem, 3vw, 5rem);
        line-height: 0.9;
        letter-spacing: -0.06em;
      }
      .hero-copy p {
        margin: 0;
        color: #dfe9f8;
        line-height: 1.75;
        font-size: 1.02rem;
      }

      .hero-actions {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 24px;
      }
      .primary-btn, .secondary-btn {
        min-width: 140px;
        padding: 13px 22px;
        border-radius: 12px;
        font-weight: 800;
        transition: transform 0.18s ease;
      }
      .primary-btn {
        background: linear-gradient(135deg, var(--red), var(--red-2));
        color: white;
      }
      .secondary-btn {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        color: var(--text);
      }
      .primary-btn:hover, .secondary-btn:hover, .ghost-btn:hover, .lang-toggle:hover { transform: translateY(-1px); }

      .hero-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 18px;
      }
      .hero-meta span {
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(11, 17, 26, 0.56);
        border: 1px solid rgba(255,255,255,0.08);
        color: #ebf2ff;
        font-size: 0.82rem;
      }

      .hero-poster {
        display: flex;
        justify-content: center;
      }
      .hero-poster-card {
        position: relative;
        width: min(100%, 340px);
        border-radius: 28px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 18px 50px rgba(0,0,0,0.45);
      }
      .hero-poster-card img {
        width: 100%;
        height: 440px;
        object-fit: cover;
      }
      .hero-poster-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.16) 50%, rgba(0,0,0,0.76) 100%);
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin: 26px 0 8px;
      }
      .filter-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .toolbar select {
        min-width: 180px;
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(17,24,39,0.9);
        border: 1px solid var(--line);
        color: var(--text);
        outline: none;
      }

      .section-block { margin-top: 30px; }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }
      .section-head h2 {
        margin: 0;
        font-size: clamp(1.2rem, 2vw, 1.9rem);
      }
      .section-head a {
        color: var(--muted);
        font-weight: 700;
      }

      .catalog-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 18px;
      }

      .movie-card {
        position: relative;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      }
      .movie-card:hover {
        transform: translateY(-5px);
        border-color: rgba(255,255,255,0.18);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      .movie-card img {
        width: 100%;
        height: 270px;
        object-fit: cover;
        background: linear-gradient(180deg, #0f172a, #1e293b);
      }
      .movie-card .card-body {
        position: absolute;
        inset: auto 0 0 0;
        padding: 14px 12px 12px;
        background: linear-gradient(180deg, rgba(10, 12, 18, 0), rgba(10, 12, 18, 0.92));
      }
      .card-title {
        display: block;
        font-size: 0.95rem;
        font-weight: 800;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 6px;
        color: #dfe7f7;
        font-size: 0.72rem;
      }
      .lang-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 44px;
        padding: 4px 8px;
        border-radius: 7px;
        font-size: 0.68rem;
        font-weight: 800;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
      }
      .lang-badge.vf { background: rgba(90,169,255,0.14); color: #bfe0ff; }
      .lang-badge.vostfr { background: rgba(74,222,128,0.12); color: #c9f7d5; }
      .lang-badge.vo { background: rgba(244,201,109,0.12); color: #ffe8b0; }
      .lang-badge.hd { background: rgba(255,59,87,0.12); color: #ffd3db; }

      .movie-card .top-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 8px;
        border-radius: 999px;
        font-size: 0.68rem;
        font-weight: 800;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(255,255,255,0.08);
      }

      .player-panel {
        display: none;
        margin-top: 32px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: rgba(9, 13, 22, 0.88);
        overflow: hidden;
      }
      .player-panel.visible { display: block; }

      .player-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }
      .close-btn {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border: 1px solid var(--line);
      }

      .player-layout {
        display: grid;
        grid-template-columns: 1.5fr 0.7fr;
        gap: 20px;
        padding: 18px;
      }

      .player-box {
        border-radius: 18px;
        overflow: hidden;
        background: #000;
        border: 1px solid rgba(255,255,255,0.08);
      }
      .player-box video, .player-box iframe {
        width: 100%;
        height: 100%;
        min-height: 420px;
        background: #000;
        border: none;
      }

      .player-info {
        padding: 18px;
        border: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.54);
        border-radius: 18px;
      }
      .player-info h3 {
        margin: 0 0 10px;
        font-size: clamp(1.35rem, 2vw, 2rem);
      }
      .player-summary {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.7;
      }
      .player-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 18px;
      }
      .player-tags span {
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        color: #dfe7f7;
        font-size: 0.74rem;
      }

      .server-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }
      .server-btn {
        padding: 11px 14px;
        border-radius: 12px;
        background: rgba(255,255,255,0.03);
        color: var(--text);
        border: 1px solid var(--line);
      }
      .server-btn.active {
        background: linear-gradient(135deg, var(--red), var(--red-2));
        border-color: transparent;
      }

      .empty-state, .loading-state {
        display: grid;
        place-items: center;
        min-height: 180px;
        border: 1px dashed var(--line);
        border-radius: 16px;
        background: rgba(255,255,255,0.015);
        color: var(--muted);
      }

      .hidden { display: none !important; }

      @media (max-width: 980px) {
        .feature-hero, .player-layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 740px) {
        .site-header {
          flex-wrap: wrap;
          justify-content: center;
        }
        .nav { order: 3; width: 100%; justify-content: center; overflow-x: auto; }
        .header-tools { width: 100%; justify-content: center; }
        .search-box { width: 100%; min-width: 0; }
        .app-shell { padding-inline: 12px; }
        .feature-hero { padding: 18px; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <div class="brand"><span class="brand-mark">P</span><span>PRINCE MOVIE</span></div>
        <nav class="nav">
          <a href="#" class="active">Accueil</a>
          <a href="#">Films</a>
          <a href="#">Séries</a>
          <a href="#">Nouveautés</a>
          <a href="#">Ma liste</a>
        </nav>
        <div class="header-tools">
          <div class="search-box">
            <span>⌕</span>
            <input id="searchInput" type="text" placeholder="Rechercher un film ou une série" />
          </div>
          <button id="langToggle" class="lang-toggle" type="button">FR</button>
        </div>
      </header>

      <main>
        <section class="feature-hero">
          <div class="hero-copy">
            <span class="eyebrow" id="heroLabel">À l'affiche</span>
            <h1 id="featuredTitle">Chargement...</h1>
            <p id="featuredDescription">Chargement du programme...</p>

            <div class="hero-actions">
              <button class="primary-btn" id="playFeaturedBtn" type="button">▶ Lecture</button>
              <button class="secondary-btn" id="addFeaturedBtn" type="button">＋ Ma liste</button>
            </div>

            <div class="hero-meta">
              <span id="featuredYear">2026</span>
              <span id="featuredRating">8.9</span>
              <span id="featuredLang">VF</span>
              <span id="featuredType">Film</span>
            </div>
          </div>

          <div class="hero-poster">
            <div class="hero-poster-card">
              <img id="featuredPoster" src="" alt="Affiche" />
            </div>
          </div>
        </section>

        <div class="toolbar">
          <div class="filter-wrap">
            <select id="genreFilter">
              <option value="Tout">Tous les genres</option>
            </select>
            <select id="languageFilter">
              <option value="Tous">Toutes les langues</option>
              <option value="VF">VF</option>
              <option value="VOSTFR">VOSTFR</option>
              <option value="VO">VO</option>
            </select>
          </div>
        </div>

        <section class="section-block">
          <div class="section-head">
            <h2 id="catalogTitle">Catalogue</h2>
            <a href="#" id="catalogViewAll">Voir tout</a>
          </div>
          <div id="catalogGrid" class="catalog-grid"></div>
        </section>
      </main>
    </div>

    <aside id="playerPanel" class="player-panel" aria-live="polite">
      <div class="player-head">
        <h2 id="playerTitle">Lecture</h2>
        <button class="close-btn" id="closePlayerBtn" aria-label="Fermer">✕</button>
      </div>
      <div class="player-layout">
        <div class="player-box">
          <video id="videoPlayer" controls playsinline preload="metadata" crossorigin="anonymous"></video>
          <iframe id="embedPlayer" class="hidden" title="Lecteur vidéo" allowfullscreen="true" loading="lazy"></iframe>
        </div>

        <div class="player-info">
          <h3 id="infoTitle">Titre</h3>
          <p id="infoDescription" class="player-summary"></p>
          <div class="player-tags" id="infoTags"></div>
          <div class="server-tabs" id="serverTabs"></div>
        </div>
      </div>
    </aside>

    <script>
      const API_BASE = 'http://51.75.118.170:20041/api/v1';
      const defaultServers = [
        { name: 'Serveur 1', url: '' },
        { name: 'Serveur 2', url: '' },
        { name: 'Serveur 3', url: '' },
        { name: 'Serveur 4', url: '' },
        { name: 'Serveur 5', url: '' }
      ];

      const translations = {
        fr: {
          home: 'Accueil',
          films: 'Films',
          series: 'Séries',
          news: 'Nouveautés',
          list: 'Ma liste',
          search: 'Rechercher un film ou une série',
          trailer: 'À l\'affiche',
          watch: 'Lecture',
          myList: 'Ma liste',
          catalog: 'Catalogue',
          viewAll: 'Voir tout',
          allGenres: 'Tous les genres',
          allLanguages: 'Toutes les langues',
          loading: 'Chargement...',
          noResults: 'Aucun résultat trouvé.',
          noApi: 'Impossible de récupérer le catalogue. Vérifiez l\'API.',
          noSource: 'Aucune source de lecture disponible pour ce titre pour le moment. Réessayez plus tard.',
          player: 'Lecture',
          server: 'Serveur',
          movie: 'Film',
          seriesType: 'Série',
          quality: 'HD'
        },
        en: {
          home: 'Home',
          films: 'Movies',
          series: 'Series',
          news: 'New',
          list: 'My list',
          search: 'Search for a movie or series',
          trailer: 'Featured',
          watch: 'Watch',
          myList: 'My list',
          catalog: 'Catalog',
          viewAll: 'View all',
          allGenres: 'All genres',
          allLanguages: 'All languages',
          loading: 'Loading...',
          noResults: 'No results found.',
          noApi: 'Unable to load the catalog. Please check the API.',
          noSource: 'No playback source is available for this title right now. Please try again later.',
          player: 'Player',
          server: 'Server',
          movie: 'Movie',
          seriesType: 'Series',
          quality: 'HD'
        }
      };

      const state = {
        locale: 'fr',
        items: [],
        filtered: [],
        selected: null,
        activeServerIndex: 0,
        activeGenre: 'Tout',
        activeLanguage: 'Tous',
        search: ''
      };

      const catalogGrid = document.getElementById('catalogGrid');
      const heroLabel = document.getElementById('heroLabel');
      const featuredTitle = document.getElementById('featuredTitle');
      const featuredDescription = document.getElementById('featuredDescription');
      const featuredPoster = document.getElementById('featuredPoster');
      const featuredYear = document.getElementById('featuredYear');
      const featuredRating = document.getElementById('featuredRating');
      const featuredLang = document.getElementById('featuredLang');
      const featuredType = document.getElementById('featuredType');
      const genreFilter = document.getElementById('genreFilter');
      const languageFilter = document.getElementById('languageFilter');
      const searchInput = document.getElementById('searchInput');
      const catalogTitle = document.getElementById('catalogTitle');
      const catalogViewAll = document.getElementById('catalogViewAll');
      const langToggle = document.getElementById('langToggle');
      const playerPanel = document.getElementById('playerPanel');
      const videoPlayer = document.getElementById('videoPlayer');
      const embedPlayer = document.getElementById('embedPlayer');
      const serverTabs = document.getElementById('serverTabs');
      const infoTitle = document.getElementById('infoTitle');
      const infoDescription = document.getElementById('infoDescription');
      const infoTags = document.getElementById('infoTags');
      const playerTitle = document.getElementById('playerTitle');

      function t(key) {
        return translations[state.locale]?.[key] || translations.fr[key] || key;
      }

      function applyTranslations() {
        const navs = document.querySelectorAll('.nav a');
        const texts = ['home', 'films', 'series', 'news', 'list'];
        navs.forEach((link, index) => {
          if (texts[index]) link.textContent = t(texts[index]);
        });

        heroLabel.textContent = t('trailer');
        featuredTitle.textContent = t('loading');
        featuredDescription.textContent = t('loading');
        catalogTitle.textContent = t('catalog');
        catalogViewAll.textContent = t('viewAll');
        playerTitle.textContent = t('player');
        document.getElementById('playFeaturedBtn').textContent = '▶ ' + t('watch');
        document.getElementById('addFeaturedBtn').textContent = '＋ ' + t('myList');
        searchInput.placeholder = t('search');
        langToggle.textContent = state.locale.toUpperCase();
        genreFilter.options[0].text = t('allGenres');
        languageFilter.options[0].text = t('allLanguages');
      }

      function normalizeUrl(url) {
        if (!url || typeof url !== 'string') return '';
        const clean = url.trim();
        if (!clean) return '';
        if (/^https?:\/\//i.test(clean)) {
          if (clean.includes('51.75.118.170')) {
            return '/api/proxy?url=' + encodeURIComponent(clean);
          }
          return clean;
        }
        if (clean.startsWith('//')) return 'https:' + clean;
        return clean;
      }

      function toSafeSource(url) {
        return normalizeUrl(url);
      }

      function buildApiUrl(path, params = {}) {
        const url = new URL(API_BASE + path);
        Object.entries(params).forEach(([key, value]) => {
          if (value !== undefined && value !== null && value !== '') {
            url.searchParams.set(key, String(value));
          }
        });
        return url.toString();
      }

      async function apiFetch(path, params = {}) {
        const url = buildApiUrl(path, params);
        const response = await fetch(url, { headers: { Accept: 'application/json' } });
        if (!response.ok) throw new Error(`API Error ${response.status}`);
        return response.json();
      }

      function deepGetFirst(obj, keys) {
        for (const key of keys) {
          const value = obj?.[key];
          if (value !== undefined && value !== null && value !== '') return value;
        }
        return undefined;
      }

      function toNumber(value, fallback = 0) {
        const n = Number(value);
        return Number.isFinite(n) ? n : fallback;
      }

      function extractArray(payload) {
        if (!payload) return [];
        const candidates = [
          payload,
          payload.data,
          payload.result,
          payload.response,
          payload.items,
          payload.movies,
          payload.results,
          payload.series,
          payload.data?.data,
          payload.data?.items,
          payload.data?.movies,
          payload.data?.results,
          payload.items?.data,
          payload.data?.series,
          payload.content,
          payload.list,
          payload.entries,
          payload.catalog,
          payload.media,
          payload.home
        ];

        for (const candidate of candidates) {
          if (Array.isArray(candidate)) return candidate;
        }

        if (payload && typeof payload === 'object') {
          for (const value of Object.values(payload)) {
            if (Array.isArray(value)) return value;
          }
        }

        return [];
      }

      function normalizeItem(raw) {
        if (!raw || typeof raw !== 'object') return null;
        const title = deepGetFirst(raw, ['title', 'name', 'original_title', 'original_name', 'slug']) || 'Sans titre';
        const description = deepGetFirst(raw, ['description', 'overview', 'synopsis', 'story', 'summary']) || 'Aucune description disponible.';
        const poster = deepGetFirst(raw, ['poster', 'poster_url', 'image', 'cover', 'thumbnail', 'posterUrl', 'backdrop', 'image_url', 'cover_url']) || '';
        const year = deepGetFirst(raw, ['year', 'release_year', 'released_at', 'date', 'published_at']) || '2026';
        const id = deepGetFirst(raw, ['id', '_id', 'movie_id', 'series_id', 'slug']) || title;
        const type = String(deepGetFirst(raw, ['type', 'category', 'media_type']) || 'movie').toLowerCase();
        const language = String(deepGetFirst(raw, ['language', 'lang', 'audio_language', 'audio', 'subtitle']) || 'VF').toUpperCase();
        const quality = deepGetFirst(raw, ['quality', 'resolution', 'format']) || 'HD';
        const rating = deepGetFirst(raw, ['rating', 'score', 'vote_average']) || '8.8';
        const genres = Array.isArray(raw.genres) ? raw.genres : (typeof raw.genre === 'string' ? [raw.genre] : []);

        return {
          id,
          title,
          description,
          poster,
          year,
          type,
          language,
          quality,
          rating,
          genres,
          original: raw,
          servers: Array.isArray(raw.servers) ? raw.servers : []
        };
      }

      function getPoster(item) {
        return normalizeUrl(item.poster || 'https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=900&q=80');
      }

      function getLanguageBadge(language) {
        const normalized = String(language || 'VF').toUpperCase();
        if (normalized.includes('VOST')) return 'VOSTFR';
        if (normalized.includes('VO')) return 'VO';
        return normalized || 'VF';
      }

      function pickTypeLabel(type) {
        return type === 'series' || type === 'serie' ? t('seriesType') : t('movie');
      }

      function readDirectSource(value) {
        if (!value) return null;

        if (typeof value === 'string') {
          const s = value.trim();
          if (!s) return null;
          if (/^https?:\/\//i.test(s) || /^\/\//.test(s) || s.startsWith('blob:') || s.startsWith('data:')) {
            return { url: toSafeSource(s), type: /\.m3u8($|\?|#)/i.test(s) ? 'video' : 'iframe' };
          }
          return null;
        }

        if (Array.isArray(value)) {
          for (const entry of value) {
            const found = readDirectSource(entry);
            if (found) return found;
          }
          return null;
        }

        if (typeof value === 'object') {
          const candidateKeys = [
            'url', 'src', 'source', 'href', 'stream_url', 'video_url', 'player_url', 'embed_url',
            'file', 'file_url', 'mp4', 'hls', 'm3u8', 'link', 'download', 'playback', 'video'
          ];

          for (const key of candidateKeys) {
            const found = readDirectSource(value[key]);
            if (found) return found;
          }

          for (const [key, nested] of Object.entries(value)) {
            const lower = key.toLowerCase();
            if (lower.includes('url') || lower.includes('source') || lower.includes('stream') || lower.includes('video') || lower.includes('player') || lower.includes('embed')) {
              const found = readDirectSource(nested);
              if (found) return found;
            }
          }
        }

        return null;
      }

      function collectServerList(item) {
        const rawServers = Array.isArray(item.original?.servers) ? item.original.servers : [];
        if (rawServers.length) {
          return rawServers.map((server, index) => ({
            name: server.name || `${t('server')} ${index + 1}`,
            url: server.url || server.src || server.link || '',
            type: server.type || 'video'
          }));
        }

        return [...defaultServers];
      }

      async function loadFromApiCandidates(type, id) {
        const endpointCandidates = [
          `/stream/${encodeURIComponent(id)}`,
          `/${type}/${encodeURIComponent(id)}`,
          `/${type}s/${encodeURIComponent(id)}`,
          `/movies/${encodeURIComponent(id)}`,
          `/episodes/${encodeURIComponent(id)}`,
          `/tv/${encodeURIComponent(id)}`
        ];

        for (const endpoint of endpointCandidates) {
          try {
            const payload = await apiFetch(endpoint);
            const source = readDirectSource(payload);
            if (source) return source;

            for (const nested of extractArray(payload)) {
              const direct = readDirectSource(nested);
              if (direct) return direct;
            }
          } catch (error) {
            // retry with next endpoint
          }
        }

        return null;
      }

      async function resolvePlayerSource(item, serverIndex = 0) {
        const serverList = collectServerList(item);
        const chosen = serverList[serverIndex] || serverList[0] || {};

        if (chosen.url) {
          return { url: normalizeUrl(chosen.url), type: chosen.type || 'video' };
        }

        const directFromItem = readDirectSource(item.original);
        if (directFromItem) return directFromItem;

        const directCandidates = [
          item.original?.stream_url,
          item.original?.video_url,
          item.original?.embed_url,
          item.original?.player_url,
          item.original?.src,
          item.original?.source,
          item.original?.sources,
          item.original?.data,
          item.original?.items,
          item.original?.result,
          item.original?.movies,
          item.original?.episodes
        ];

        for (const candidate of directCandidates) {
          const found = readDirectSource(candidate);
          if (found) return found;
        }

        const fallback = await loadFromApiCandidates(item.type, String(item.id));
        if (fallback) return fallback;

        return { url: '', type: 'video' };
      }

      function renderCatalog() {
        if (!state.filtered.length) {
          catalogGrid.innerHTML = '<div class="empty-state">' + t('noResults') + '</div>';
          return;
        }

        const html = state.filtered.map((item) => `
          <article class="movie-card" data-id="${String(item.id)}" tabindex="0" role="button">
            <img src="${getPoster(item)}" alt="${item.title}" />
            <div class="top-badge">${item.quality || 'HD'}</div>
            <div class="card-body">
              <span class="card-title">${item.title}</span>
              <div class="card-meta">
                <span>${item.year || '2026'}</span>
                <span class="lang-badge ${String(getLanguageBadge(item.language)).toLowerCase()}">${getLanguageBadge(item.language)}</span>
              </div>
            </div>
          </article>
        `).join('');

        catalogGrid.innerHTML = html;

        catalogGrid.querySelectorAll('.movie-card').forEach((card) => {
          card.addEventListener('click', () => {
            const item = state.items.find((entry) => String(entry.id) === card.dataset.id);
            if (item) openPlayer(item);
          });
        });
      }

      function populateHero(item) {
        heroLabel.textContent = t('trailer');
        featuredTitle.textContent = item.title;
        featuredDescription.textContent = item.description;
        featuredPoster.src = getPoster(item);
        featuredYear.textContent = item.year || '2026';
        featuredRating.textContent = item.rating || '8.9';
        featuredLang.textContent = getLanguageBadge(item.language);
        featuredType.textContent = pickTypeLabel(item.type);
        document.getElementById('playFeaturedBtn').onclick = () => openPlayer(item);
      }

      function populateGenres(options = []) {
        const unique = [...new Set(['Tout', ...options].filter(Boolean))];
        genreFilter.innerHTML = unique.map((genre) => {
          if (genre === 'Tout') return '<option value="Tout">' + t('allGenres') + '</option>';
          return `<option value="${genre}">${genre}</option>`;
        }).join('');
        genreFilter.value = state.activeGenre || 'Tout';
      }

      function applyFilters() {
        const term = state.search.trim().toLowerCase();
        state.filtered = state.items.filter((item) => {
          const matchesSearch = !term || item.title.toLowerCase().includes(term) || (item.description || '').toLowerCase().includes(term);
          const matchesGenre = state.activeGenre === 'Tout' || (item.genres || []).includes(state.activeGenre);
          const matchesLanguage = state.activeLanguage === 'Tous' || getLanguageBadge(item.language) === state.activeLanguage;
          return matchesSearch && matchesGenre && matchesLanguage;
        });

        renderCatalog();
      }

      function setPlayerVisible(visible) {
        playerPanel.classList.toggle('visible', visible);
        if (!visible) {
          videoPlayer.pause();
          videoPlayer.src = '';
          embedPlayer.src = '';
          embedPlayer.classList.add('hidden');
          videoPlayer.classList.remove('hidden');
        }
      }

      function renderInfoTags(item) {
        const tags = [
          item.year || '2026',
          pickTypeLabel(item.type),
          getLanguageBadge(item.language),
          item.quality || 'HD',
          ...(item.genres || []).slice(0, 3)
        ];

        infoTags.innerHTML = tags.map((tag) => `<span>${tag}</span>`).join('');
      }

      function clearPlayer() {
        videoPlayer.pause();
        videoPlayer.src = '';
        embedPlayer.src = '';
        embedPlayer.classList.add('hidden');
        videoPlayer.classList.remove('hidden');
      }

      async function playWithServer(item, serverIndex) {
        const result = await resolvePlayerSource(item, serverIndex);
        if (!result || !result.url) {
          infoDescription.textContent = t('noSource');
          return;
        }

        const url = normalizeUrl(result.url);
        const isEmbed = /youtube|vimeo|embed|iframe|player|watch\?/i.test(url) || result.type === 'iframe';

        if (isEmbed) {
          videoPlayer.classList.add('hidden');
          embedPlayer.classList.remove('hidden');
          embedPlayer.src = url;
          return;
        }

        videoPlayer.classList.remove('hidden');
        embedPlayer.classList.add('hidden');
        embedPlayer.src = '';
        videoPlayer.src = url;
        videoPlayer.load();
      }

      async function openPlayer(item) {
        state.selected = item;
        infoTitle.textContent = item.title;
        infoDescription.textContent = item.description;
        renderInfoTags(item);
        setPlayerVisible(true);
        clearPlayer();

        const serverList = collectServerList(item);
        serverTabs.innerHTML = serverList.map((server, index) => `
          <button class="server-btn ${index === state.activeServerIndex ? 'active' : ''}" data-index="${index}" type="button">
            ${server.name}
          </button>
        `).join('');

        serverTabs.querySelectorAll('.server-btn').forEach((button) => {
          button.addEventListener('click', async () => {
            state.activeServerIndex = Number(button.dataset.index || 0);
            serverTabs.querySelectorAll('.server-btn').forEach((btn) => {
              btn.classList.toggle('active', Number(btn.dataset.index) === state.activeServerIndex);
            });
            await playWithServer(item, state.activeServerIndex);
          });
        });

        await playWithServer(item, state.activeServerIndex);
      }

      function extractHomeList(payload) {
        const first = extractArray(payload);
        if (first.length) return first.map(normalizeItem).filter(Boolean);

        if (payload && typeof payload === 'object') {
          const nested = Object.values(payload).find((value) => Array.isArray(value));
          if (nested) return nested.map(normalizeItem).filter(Boolean);
        }

        return [];
      }

      async function loadContent() {
        try {
          const payload = await apiFetch('/home');
          const items = extractHomeList(payload);
          state.items = items.filter(Boolean);

          if (!state.items.length) {
            catalogGrid.innerHTML = '<div class="empty-state">' + t('noApi') + '</div>';
            return;
          }

          const allGenres = [...new Set(state.items.flatMap((item) => item.genres || []).filter(Boolean))];
          populateGenres(allGenres);
          state.filtered = [...state.items];
          populateHero(state.items[0]);
          renderCatalog();
        } catch (error) {
          catalogGrid.innerHTML = '<div class="empty-state">' + t('noApi') + '</div>';
          console.error(error);
        }
      }

      searchInput.addEventListener('input', (event) => {
        state.search = event.target.value;
        applyFilters();
      });

      genreFilter.addEventListener('change', (event) => {
        state.activeGenre = event.target.value;
        applyFilters();
      });

      languageFilter.addEventListener('change', (event) => {
        state.activeLanguage = event.target.value;
        applyFilters();
      });

      document.getElementById('closePlayerBtn').addEventListener('click', () => setPlayerVisible(false));
      document.getElementById('langToggle').addEventListener('click', () => {
        state.locale = state.locale === 'fr' ? 'en' : 'fr';
        applyTranslations();
      });

      document.getElementById('addFeaturedBtn').addEventListener('click', () => {
        const featured = state.items[0];
        if (featured) openPlayer(featured);
      });

      window.addEventListener('DOMContentLoaded', () => {
        applyTranslations();
        loadContent();
      });
    </script>
  </body>
</html>
