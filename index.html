<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AZUR — Streaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#04060c; --panel:#0a1022; --panel2:#101a36; --line:#18264a;
  --blue:#2f6bff; --blue2:#1b45c9; --ice:#9dbcff; --text:#e9efff; --muted:#8794b8;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--text);font-family:'Sora',system-ui,sans-serif;font-weight:400;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.hidden{display:none!important}

/* ---------- Connexion ---------- */
#login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;overflow:auto}
#mosaic{position:absolute;inset:-10%;display:grid;grid-template-columns:repeat(8,1fr);gap:10px;transform:rotate(-6deg);opacity:.55;filter:saturate(1.2)}
#mosaic div{aspect-ratio:2/3;border-radius:8px;background-size:cover;background-position:center}
#login::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 40%,rgba(4,6,12,.55),var(--ink) 85%),linear-gradient(180deg,rgba(4,6,12,.7),var(--ink))}
.lcard{position:relative;z-index:2;width:100%;max-width:410px;background:rgba(6,10,22,.88);border:1px solid var(--line);border-radius:16px;padding:38px 34px;backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.logo{font-weight:800;letter-spacing:.06em;font-size:30px;color:var(--blue);text-shadow:0 0 28px rgba(47,107,255,.55)}
.lcard h1{font-size:26px;font-weight:600;margin:22px 0 6px}
.lcard p.sub{color:var(--muted);font-size:14px;margin-bottom:22px}
.field{position:relative;margin-bottom:14px}
.field input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 14px 8px;font-size:15px}
.field input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(47,107,255,.2)}
.field label{position:absolute;left:14px;top:14px;font-size:14px;color:var(--muted);pointer-events:none;transition:.15s}
.field input:focus+label,.field input:not(:placeholder-shown)+label{top:6px;font-size:11px;color:var(--ice)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);padding:13px 22px;font-weight:600;font-size:15px;transition:.15s}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:#4a80ff}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--text)}
.btn.ghost:hover{background:rgba(255,255,255,.18)}
.lcard .btn{width:100%;margin-top:6px}
.err{color:#ff8a8a;font-size:13px;min-height:18px;margin-bottom:6px}
.switch{margin-top:20px;color:var(--muted);font-size:14px}
.switch button{color:var(--ice);font-weight:600;text-decoration:underline}

/* ---------- Navigation ---------- */
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:26px;padding:14px 4vw;background:linear-gradient(180deg,rgba(4,6,12,.95),rgba(4,6,12,0));transition:background .25s}
nav.solid{background:rgba(4,6,12,.96);border-bottom:1px solid var(--line)}
nav .logo{font-size:24px;cursor:pointer}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 13px;border-radius:999px;font-size:14px;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:#fff;background:var(--blue2)}
.tools{display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:38px}
.search input{background:none;border:0;outline:none;width:150px;font-size:14px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;font-weight:600;font-size:14px}

/* ---------- Hero ---------- */
.hero{position:relative;height:84vh;min-height:520px;display:flex;align-items:flex-end;padding:0 4vw 9vh;background-size:cover;background-position:center 20%}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--ink) 8%,rgba(4,6,12,.45) 55%,rgba(4,6,12,.1)),linear-gradient(0deg,var(--ink) 2%,rgba(4,6,12,0) 40%)}
.hero .in{position:relative;max-width:620px}
.hero h2{font-size:clamp(34px,6vw,68px);font-weight:800;line-height:1.02;letter-spacing:-.02em}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 12px;font-size:14px;color:var(--ice)}
.meta span+span::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--muted);margin-right:10px;vertical-align:middle}
.hero p{color:#c4cee8;line-height:1.6;font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero .acts{display:flex;gap:12px;margin-top:24px}

/* ---------- Rangées et cartes ---------- */
main{padding-bottom:70px}
.row{margin:0 0 30px}
.row h3{font-size:19px;font-weight:600;padding:0 4vw;margin-bottom:12px}
.scroller{display:flex;gap:10px;overflow-x:auto;padding:6px 4vw 14px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.card{flex:0 0 auto;width:168px;scroll-snap-align:start;position:relative;border-radius:var(--r);overflow:hidden;background:var(--panel);aspect-ratio:2/3;transition:transform .2s,box-shadow .2s;text-align:left}
.card:hover,.card:focus-visible{transform:scale(1.06);z-index:3;box-shadow:0 14px 40px rgba(47,107,255,.35)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:30px 10px 10px;background:linear-gradient(0deg,rgba(4,6,12,.96),transparent);font-size:13px;font-weight:600;line-height:1.25}
.card .badge{position:absolute;top:8px;right:8px;background:rgba(4,6,12,.8);color:var(--ice);font-size:11px;padding:3px 7px;border-radius:6px}
.card.live .badge{background:#d11f3a;color:#fff}
.ph{width:100%;height:100%;display:grid;place-items:center;padding:12px;text-align:center;font-weight:600;font-size:14px;background:linear-gradient(160deg,var(--panel2),var(--blue2))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:0 4vw}
.grid .card{width:auto}
.pagehead{padding:100px 4vw 22px}
.pagehead h2{font-size:34px;font-weight:800;letter-spacing:-.01em}
.pagehead p{color:var(--muted);margin-top:6px;font-size:14px}
.empty{padding:60px 4vw;color:var(--muted);line-height:1.6}
.skel{flex:0 0 auto;width:168px;aspect-ratio:2/3;border-radius:var(--r);background:linear-gradient(90deg,var(--panel),var(--panel2),var(--panel));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.notice{margin:90px 4vw 0;padding:12px 16px;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:var(--r);background:var(--panel);font-size:13px;color:var(--ice);line-height:1.5}

/* ---------- Fenêtres ---------- */
.modal{position:fixed;inset:0;z-index:40;background:rgba(2,4,10,.82);display:grid;place-items:center;padding:16px;overflow:auto}
.sheet{width:100%;max-width:820px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.7)}
.sheet .top{position:relative;height:300px;background-size:cover;background-position:center}
.sheet .top::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--panel),rgba(10,16,34,.1) 70%)}
.sheet .body{padding:0 30px 30px;margin-top:-70px;position:relative;z-index:2}
.sheet h2{font-size:30px;font-weight:800;line-height:1.1}
.sheet p{color:#c4cee8;line-height:1.65;font-size:15px;margin:10px 0 20px}
.close{position:absolute;top:12px;right:12px;z-index:5;width:38px;height:38px;border-radius:50%;background:rgba(4,6,12,.8);font-size:18px}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:6px;max-height:220px;overflow:auto}
.chapters button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;text-align:left}
.chapters button:hover{border-color:var(--blue)}
#player{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
#player .bar{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--ink);border-bottom:1px solid var(--line)}
#player .bar b{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .stage{flex:1;min-height:0;background:#000;display:grid;place-items:center}
#player video,#player iframe{width:100%;height:100%;border:0;background:#000}
#reader{flex:1;overflow:auto;background:#05070d;text-align:center}
#reader img{display:block;max-width:min(100%,820px);margin:0 auto}
.srv{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.srv .btn{padding:8px 12px;font-size:13px;white-space:nowrap}
.srv .btn.on{background:var(--blue);color:#fff}
.notice .tab{margin-left:10px}
.diag{margin-top:12px;padding:10px;background:var(--ink);border:1px solid var(--line);border-radius:8px;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--ice);white-space:pre-wrap;word-break:break-all;max-height:320px;overflow:auto}
.msg{color:var(--muted);padding:30px;line-height:1.6}
footer{padding:30px 4vw;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}

@media (max-width:760px){
  nav{flex-wrap:wrap;gap:8px 14px;padding:10px 4vw;background:rgba(4,6,12,.96)}
  .tabs{order:3;flex-basis:100%}
  .search input{width:90px}
  .hero{height:70vh;padding-bottom:6vh}
  .card{width:128px}.skel{width:128px}
  .pagehead{padding-top:130px}
  .notice{margin-top:120px}
  .sheet .top{height:210px}
  #mosaic{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ===== CONNEXION ===== -->
<section id="login">
  <div id="mosaic" aria-hidden="true"></div>
  <form class="lcard" id="authForm" autocomplete="on">
    <div class="logo">AZUR</div>
    <h1 id="authTitle">Connexion</h1>
    <p class="sub" id="authSub">Connecte-toi pour regarder films, séries, animés et plus.</p>
    <div class="field hidden" id="nameField">
      <input id="name" type="text" placeholder=" " autocomplete="name">
      <label for="name">Nom d'utilisateur</label>
    </div>
    <div class="field">
      <input id="email" type="email" placeholder=" " autocomplete="email" required>
      <label for="email">Adresse e-mail</label>
    </div>
    <div class="field">
      <input id="pass" type="password" placeholder=" " autocomplete="current-password" required minlength="4">
      <label for="pass">Mot de passe</label>
    </div>
    <div class="err" id="authErr" role="alert"></div>
    <button class="btn primary" id="authBtn" type="submit">Se connecter</button>
    <div class="switch"><span id="switchTxt">Nouveau ici ?</span> <button type="button" id="switchBtn">Créer un compte</button></div>
  </form>
</section>

<!-- ===== SITE ===== -->
<div id="app" class="hidden">
  <nav id="nav">
    <div class="logo" id="home">AZUR</div>
    <div class="tabs" id="tabs"></div>
    <div class="tools">
      <label class="search"><input id="q" type="search" placeholder="Rechercher" aria-label="Rechercher"></label>
      <button class="avatar" id="avatar" title="Se déconnecter" aria-label="Se déconnecter"></button>
    </div>
  </nav>
  <div id="view"></div>
  <footer>AZUR — Contenus fournis par l'API.</footer>
</div>

<div id="modal" class="modal hidden"></div>
<div id="player" class="hidden"></div>

<script>
/* =====================================================
   CONFIGURATION — modifie ici
   ===================================================== */
const CONFIG = {
  SITE: 'AZUR',
  // Serveurs de l'API : si le premier ne répond pas, le suivant prend le relais.
  // Ajoute les mêmes serveurs dans api/proxy.js (ou dans API_SERVERS sur Vercel).
  SERVERS: ['http://51.75.118.170:20041'],
  // Sur un site en https (Vercel…), tout passe par la fonction api/proxy.js.
  PROXY: '/api/proxy',
  // Chaque catégorie essaie ses chemins dans l'ordre jusqu'à trouver des données.
  // Adapte les chemins à ton API si besoin.
  CATS: [
    { key:'films',   label:'Films',      kind:'video', paths:['films','film','movies','movie'] },
    { key:'series',  label:'Séries',     kind:'video', paths:['series','serie','tv','shows'] },
    { key:'animes',  label:'Animés',     kind:'video', paths:['animes','anime'] },
    { key:'kdrama',  label:'K-Drama',    kind:'video', paths:['kdrama','k-drama','kdramas','drama'] },
    { key:'sport',   label:'Sport live', kind:'live',  paths:['sport','sports','live','sport-live'] },
    { key:'manga',   label:'Manga',      kind:'read',  paths:['manga','mangas'] },
    { key:'manhwa',  label:'Manhwa',     kind:'read',  paths:['manhwa','manhwas','webtoon','webtoons'] }
  ]
};
const USE_PROXY = location.protocol === 'https:';
const proxyPath = p => `${CONFIG.PROXY}?path=${encodeURIComponent(p.startsWith('/') ? p : '/' + p)}`;
const proxyMedia = u => `${CONFIG.PROXY}?u=${encodeURIComponent(u)}`;

/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return mem[k] ?? null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){ mem[k]=v } },
  del(k){ try{ localStorage.removeItem(k) }catch(e){ delete mem[k] } }
};
function svgPoster(t,i=0){
  const h = (i*47+215)%360;
  const s = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},70%,18%)"/><stop offset="1" stop-color="hsl(${h},85%,42%)"/></linearGradient></defs><rect width="300" height="450" fill="url(#g)"/></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(s);
}

/* ---------- Normalisation des données de l'API ---------- */
function pick(o, keys){ for(const k of keys){ if(o[k] !== undefined && o[k] !== null && o[k] !== '') return o[k]; } return ''; }
function absUrl(u){
  if(!u || typeof u !== 'string') return '';
  if(u.startsWith('data:')) return u;
  if(/^(https?:)?\/\//.test(u)){
    if(USE_PROXY && u.startsWith('http://') && CONFIG.SERVERS.some(sv => u.startsWith(sv))) return proxyMedia(u);
    return u;
  }
  const p = '/' + u.replace(/^\//,'');
  return USE_PROXY ? proxyPath(p) : CONFIG.SERVERS[0] + p;
}
function toSources(raw){
  return (Array.isArray(raw) ? raw : []).map((x,n) => ({
    name: typeof x === 'string' ? 'Serveur ' + (n+1) : String(pick(x,['name','nom','label','server']) || 'Serveur ' + (n+1)),
    url: absUrl(typeof x === 'string' ? x : pick(x,['url','src','link','embed']))
  })).filter(x => x.url);
}
function srcList(obj, main){
  const l = [...(obj.sources || [])];
  if(main && !l.some(x => x.url === main)) l.unshift({ name:'Serveur 1', url:main });
  return l.map((x,i) => ({ name: /^Serveur \d+$/.test(x.name) ? 'Serveur ' + (i+1) : x.name, url:x.url }));
}
function norm(x, cat, i){
  if(typeof x === 'string') x = { title:x };
  const poster = absUrl(pick(x,['poster','image','cover','thumbnail','thumb','img','poster_path','affiche']));
  const backdrop = absUrl(pick(x,['backdrop','banner','background','fanart','backdrop_path'])) || poster;
  let video = pick(x,['video','stream','streaming','url','link','src','embed','iframe','m3u8','mp4','watch']);
  if(typeof video === 'object') video = pick(video,['url','src','link']);
  const pages = pick(x,['pages','images','imgs']);
  const chapters = pick(x,['chapters','chapitres','episodes','eps']);
  return {
    id: pick(x,['id','_id','slug','uuid']) || (cat.key + '-' + i),
    cat: cat.key, kind: cat.kind,
    title: String(pick(x,['title','titre','name','nom','label']) || 'Sans titre'),
    poster, backdrop,
    desc: String(pick(x,['description','overview','synopsis','resume','summary','plot'])),
    year: String(pick(x,['year','annee','release_year','date','release_date'])).slice(0,4),
    rating: pick(x,['rating','note','score','vote_average']),
    genre: Array.isArray(x.genres) ? x.genres.map(g=>g.name||g).join(', ') : String(pick(x,['genre','genres','category'])),
    video: absUrl(video),
    sources: toSources(pick(x,['servers','sources','links','serveurs'])),
    pages: Array.isArray(pages) ? pages.map(p => absUrl(typeof p === 'string' ? p : pick(p,['url','src','image']))) : [],
    chapters: Array.isArray(chapters) ? chapters.map((c,n)=>({
      title: String(typeof c === 'string' ? 'Chapitre ' + (n+1) : (pick(c,['title','titre','name']) || 'Chapitre ' + (n+1))),
      url: absUrl(typeof c === 'string' ? c : pick(c,['url','link','video','stream','src'])),
      sources: toSources(typeof c === 'object' ? pick(c,['servers','sources','links']) : []),
      pages: Array.isArray(c.pages||c.images) ? (c.pages||c.images).map(p => absUrl(typeof p === 'string' ? p : pick(p,['url','src','image']))) : []
    })) : [],
    live: cat.kind === 'live'
  };
}
function extractList(d){
  if(Array.isArray(d)) return d;
  if(d && typeof d === 'object'){
    for(const k of ['results','data','items','list','movies','series','animes','films','videos','content','response']){
      if(Array.isArray(d[k])) return d[k];
      if(d[k] && typeof d[k] === 'object'){ const r = extractList(d[k]); if(r.length) return r; }
    }
  }
  return [];
}

/* ---------- Chargement ---------- */
const DB = {};      // key -> items
let okCount = 0, staleCount = 0;
async function fetchJSON(url){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 12000);
  try{ const r = await fetch(url,{signal:ctl.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
// Via le proxy : il bascule lui-même entre les serveurs.
// En direct (http / fichier local) : on essaie chaque serveur dans l'ordre.
async function getJSON(p){
  if(USE_PROXY) return fetchJSON(proxyPath(p));
  let last;
  for(const sv of CONFIG.SERVERS){
    try{ return await fetchJSON(sv + p); }catch(e){ last = e; }
  }
  throw last;
}
function cacheGet(k){ try{ return JSON.parse(store.get('azur_c_' + k) || 'null'); }catch(e){ return null; } }
function cacheSet(k, list){ try{ store.set('azur_c_' + k, JSON.stringify(list.slice(0,60))); }catch(e){} }
async function loadCat(cat){
  for(const p of cat.paths){
    try{
      const list = extractList(await getJSON('/' + p));
      if(list.length){ okCount++; cacheSet(cat.key, list); return list.map((x,i)=>norm(x,cat,i)); }
    }catch(e){}
  }
  const cached = cacheGet(cat.key);
  if(cached && cached.length){ staleCount++; return cached.map((x,i)=>norm(x,cat,i)); }
  return [];
}
async function loadAll(){
  okCount = 0; staleCount = 0;
  await Promise.all(CONFIG.CATS.map(async c => { DB[c.key] = await loadCat(c); }));
}

/* ---------- Connexion ---------- */
let mode = 'login';
function setMode(m){
  mode = m;
  const reg = m === 'register';
  $('#authTitle').textContent = reg ? 'Créer un compte' : 'Connexion';
  $('#authSub').textContent = reg ? 'Quelques secondes pour rejoindre ' + CONFIG.SITE + '.' : 'Connecte-toi pour regarder films, séries, animés et plus.';
  $('#authBtn').textContent = reg ? 'Créer mon compte' : 'Se connecter';
  $('#switchTxt').textContent = reg ? 'Déjà inscrit ?' : 'Nouveau ici ?';
  $('#switchBtn').textContent = reg ? 'Se connecter' : 'Créer un compte';
  $('#nameField').classList.toggle('hidden', !reg);
  $('#authErr').textContent = '';
}
$('#switchBtn').onclick = () => setMode(mode === 'login' ? 'register' : 'login');
$('#authForm').onsubmit = e => {
  e.preventDefault();
  const email = $('#email').value.trim().toLowerCase(), pass = $('#pass').value, name = $('#name').value.trim();
  const users = JSON.parse(store.get('azur_users') || '{}');
  if(mode === 'register'){
    if(users[email]) return $('#authErr').textContent = 'Cette adresse a déjà un compte. Connecte-toi.';
    users[email] = { pass: btoa(unescape(encodeURIComponent(pass))), name: name || email.split('@')[0] };
    store.set('azur_users', JSON.stringify(users));
  }else{
    const u = users[email];
    if(!u || u.pass !== btoa(unescape(encodeURIComponent(pass)))) return $('#authErr').textContent = 'E-mail ou mot de passe incorrect.';
  }
  store.set('azur_session', JSON.stringify({ email, name: users[email].name }));
  enter();
};
function enter(){
  const s = JSON.parse(store.get('azur_session') || 'null');
  if(!s) return;
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#avatar').textContent = (s.name||'?')[0].toUpperCase();
  boot();
}
$('#avatar').onclick = () => { if(confirm('Se déconnecter ?')){ store.del('azur_session'); location.reload(); } };

/* ---------- Affichage ---------- */
let current = 'home';
function card(it){
  const img = it.poster ? `<img loading="lazy" src="${esc(it.poster)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'${esc(it.title).replace(/'/g,'')}'}))">` : `<div class="ph">${esc(it.title)}</div>`;
  return `<button class="card ${it.live?'live':''}" data-id="${esc(it.id)}" data-cat="${it.cat}" aria-label="${esc(it.title)}">${img}${it.live?'<span class="badge">LIVE</span>':(it.year?`<span class="badge">${esc(it.year)}</span>`:'')}<span class="cap">${esc(it.title)}</span></button>`;
}
function renderTabs(){
  const all = [{key:'home',label:'Accueil'}, ...CONFIG.CATS];
  $('#tabs').innerHTML = all.map(c=>`<button class="tab ${c.key===current?'on':''}" data-k="${c.key}">${c.label}</button>`).join('');
}
function notice(){
  let msg = '';
  if(!okCount && !staleCount) msg = "Impossible de joindre les serveurs pour le moment.";
  else if(staleCount) msg = "Certains serveurs ne répondent pas : la dernière version enregistrée est affichée.";
  if(!msg) return '';
  return `<div class="notice">${msg} <button class="tab on" id="retry">Réessayer</button><button class="tab" id="diag">Diagnostic</button><pre class="diag hidden" id="diagout"></pre></div>`;
}
function renderHome(){
  const pool = CONFIG.CATS.flatMap(c => DB[c.key] || []).filter(x => x.backdrop && !x.demo);
  const h = pool.length ? pool[Math.floor(Math.random()*pool.length)] : (DB.films||[])[0];
  const hero = h ? `<section class="hero" style="background-image:url('${esc(h.backdrop)}')">
    <div class="in"><h2>${esc(h.title)}</h2>
    <div class="meta">${[h.year,h.genre,h.rating?('★ '+h.rating):'',CONFIG.CATS.find(c=>c.key===h.cat).label].filter(Boolean).map(m=>`<span>${esc(m)}</span>`).join('')}</div>
    <p>${esc(h.desc)}</p>
    <div class="acts"><button class="btn primary" data-play="${esc(h.id)}" data-cat="${h.cat}">${h.kind==='read'?'Lire':'Lecture'}</button><button class="btn ghost" data-info="${esc(h.id)}" data-cat="${h.cat}">Plus d'infos</button></div></div></section>` : '';
  const rows = CONFIG.CATS.filter(c => (DB[c.key]||[]).length).map(c => `<section class="row"><h3>${c.label}</h3><div class="scroller">${(DB[c.key]||[]).slice(0,30).map(card).join('')}</div></section>`).join('');
  $('#view').innerHTML = notice() + hero + (rows ? `<main>${rows}</main>` : `<div class="empty">Aucun contenu à afficher. Vérifie que ton API est en ligne, puis réessaie.</div>`);
}
function renderCat(key){
  const c = CONFIG.CATS.find(x=>x.key===key), list = DB[key] || [];
  $('#view').innerHTML = notice() + `<div class="pagehead"><h2>${c.label}</h2><p>${list.length} titres</p></div>` +
    (list.length ? `<main><div class="grid">${list.map(card).join('')}</div></main>` : `<div class="empty">Rien à afficher pour le moment.</div>`);
}
function renderSearch(q){
  const all = CONFIG.CATS.flatMap(c=>DB[c.key]||[]);
  const res = all.filter(x => (x.title+' '+x.genre).toLowerCase().includes(q.toLowerCase()));
  $('#view').innerHTML = `<div class="pagehead"><h2>Résultats pour « ${esc(q)} »</h2><p>${res.length} titres</p></div>` +
    (res.length ? `<main><div class="grid">${res.map(card).join('')}</div></main>` : `<div class="empty">Aucun résultat. Essaie un autre titre ou un autre mot.</div>`);
}
function go(k){
  current = k; $('#q').value = ''; renderTabs(); window.scrollTo(0,0);
  k === 'home' ? renderHome() : renderCat(k);
}
function skeleton(){
  $('#view').innerHTML = `<div class="pagehead"><h2>Chargement…</h2></div><div class="scroller">${'<div class="skel"></div>'.repeat(10)}</div>`;
}
async function boot(){
  renderTabs(); skeleton();
  await loadAll();
  go('home');
}

/* ---------- Fiche et lecteur ---------- */
const find = (cat,id) => (DB[cat]||[]).find(x=>String(x.id)===String(id));
function openInfo(it){
  const m = $('#modal');
  const btn = it.kind==='read' ? 'Lire' : (it.live ? 'Regarder le direct' : 'Lecture');
  m.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(it.title)}"><div class="top" style="background-image:url('${esc(it.backdrop||it.poster)}')"><button class="close" aria-label="Fermer">✕</button></div>
    <div class="body"><h2>${esc(it.title)}</h2>
    <div class="meta">${[it.year,it.genre,it.rating?('★ '+it.rating):''].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}</div>
    <p>${esc(it.desc) || 'Pas de description disponible.'}</p>
    <button class="btn primary" data-play="${esc(it.id)}" data-cat="${it.cat}">${btn}</button>
    ${it.chapters.length ? `<h3 style="margin:22px 0 10px;font-size:16px">${it.kind==='read'?'Chapitres':'Épisodes'}</h3><div class="chapters">${it.chapters.map((c,i)=>`<button data-ch="${i}" data-id="${esc(it.id)}" data-cat="${it.cat}">${esc(c.title)}</button>`).join('')}</div>` : ''}
    </div></div>`;
  m.classList.remove('hidden');
}
function closeModal(){ $('#modal').classList.add('hidden'); $('#modal').innerHTML=''; }
function closePlayer(){ const p=$('#player'); p.classList.add('hidden'); p.innerHTML=''; }
function loadHls(cb){
  if(window.Hls) return cb();
  const s = document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js'; s.onload=cb; document.head.appendChild(s);
}
function play(it, ch){
  const pages = ch ? ch.pages : it.pages;
  const list = srcList(ch || it, ch ? ch.url : it.video);
  const title = ch ? `${it.title} — ${ch.title}` : it.title;
  const p = $('#player');
  const switcher = list.length > 1 ? `<div class="srv">${list.map((x,i)=>`<button class="btn ghost" data-srv="${i}">${esc(x.name)}</button>`).join('')}</div>` : '';
  const bar = `<div class="bar"><button class="btn ghost" id="pback">← Retour</button><b>${esc(title)}</b>${switcher}</div>`;
  if(it.kind === 'read' && (pages.length || !list.length)){
    p.innerHTML = bar + (pages.length ? `<div id="reader">${pages.map(u=>`<img loading="lazy" src="${esc(u)}" alt="">`).join('')}</div>` : `<div class="msg">Aucune page disponible pour ce titre.</div>`);
  }else if(!list.length){
    p.innerHTML = bar + `<div class="msg">Aucune source vidéo n'est disponible pour ce titre.</div>`;
  }else{
    p.innerHTML = bar + `<div class="stage" id="stage"></div>`;
    const mount = i => {
      const src = list[i].url, st = $('#stage');
      let plain = src; try{ plain = decodeURIComponent(src); }catch(e){}
      p.querySelectorAll('[data-srv]').forEach(b => b.classList.toggle('on', +b.dataset.srv === i));
      const fail = () => {
        if(i + 1 < list.length) mount(i + 1);
        else st.innerHTML = '<div class="msg">Aucun serveur ne répond pour ce titre. Réessaie plus tard.</div>';
      };
      if(/\.m3u8(\?|&|$)/i.test(plain)){
        st.innerHTML = '<video id="v" controls autoplay playsinline></video>';
        const v = $('#v');
        loadHls(() => {
          if(window.Hls && Hls.isSupported()){
            const h = new Hls(); h.loadSource(src); h.attachMedia(v);
            h.on(Hls.Events.ERROR, (_, d) => { if(d.fatal){ h.destroy(); fail(); } });
          }else{ v.onerror = fail; v.src = src; }
        });
      }else if(/\.(mp4|webm|mkv|ogg)(\?|&|$)/i.test(plain)){
        st.innerHTML = '<video controls autoplay playsinline></video>';
        const v = st.firstChild; v.onerror = fail; v.src = src;
      }else{
        st.innerHTML = `<iframe src="${esc(src)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe>`;
      }
    };
    p.querySelectorAll('[data-srv]').forEach(b => b.onclick = () => mount(+b.dataset.srv));
    mount(0);
  }
  p.classList.remove('hidden');
  $('#pback').onclick = closePlayer;
}

/* ---------- Diagnostic ---------- */
async function runDiag(){
  const out = $('#diagout'); out.classList.remove('hidden'); out.textContent = 'Test en cours…';
  const lines = [];
  const show = () => { out.textContent = lines.join('\n'); };
  lines.push(`Page : ${location.protocol}//${location.host} — mode ${USE_PROXY ? 'proxy' : 'direct'}`);
  if(USE_PROXY){
    try{ const r = await fetch(CONFIG.PROXY); lines.push(`PROXY ${r.status} ${(await r.text()).replace(/\s+/g,' ').slice(0,110)}`); }
    catch(e){ lines.push('PROXY injoignable : ' + e.message); }
    show();
  }
  const probes = [...new Set(['/', ...CONFIG.CATS.flatMap(c => c.paths.slice(0,2).map(p => '/' + p)), '/api', '/docs'])];
  for(const p of probes){
    try{
      const r = await fetch(USE_PROXY ? proxyPath(p) : CONFIG.SERVERS[0] + p);
      const t = (await r.text()).replace(/\s+/g,' ').slice(0,110);
      lines.push(`${p} → ${r.status} ${t}`);
    }catch(e){ lines.push(`${p} → erreur ${e.message}`); }
    show();
  }
  lines.push('Fin du test.');
  show();
}

/* ---------- Événements ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  if(t.closest('#retry')) return boot();
  if(t.closest('#diag')) return runDiag();
  const tab = t.closest('.tab'); if(tab) return go(tab.dataset.k);
  if(t.closest('#home')) return go('home');
  if(t.closest('.close') || t === $('#modal')) return closeModal();
  const ch = t.closest('[data-ch]');
  if(ch){ const it = find(ch.dataset.cat, ch.dataset.id); closeModal(); return play(it, it.chapters[+ch.dataset.ch]); }
  const pl = t.closest('[data-play]');
  if(pl){ const it = find(pl.dataset.cat, pl.dataset.play); closeModal(); return play(it); }
  const inf = t.closest('[data-info]');
  if(inf) return openInfo(find(inf.dataset.cat, inf.dataset.info));
  const c = t.closest('.card'); if(c) return openInfo(find(c.dataset.cat, c.dataset.id));
});
document.addEventListener('keydown', e => { if(e.key==='Escape'){ closePlayer(); closeModal(); } });
window.addEventListener('scroll', () => $('#nav').classList.toggle('solid', scrollY > 30), {passive:true});
let timer;
$('#q').addEventListener('input', e => {
  clearTimeout(timer);
  timer = setTimeout(() => { const v = e.target.value.trim(); v ? renderSearch(v) : go(current); }, 250);
});

/* ---------- Démarrage ---------- */
(function init(){
  const m = $('#mosaic');
  m.innerHTML = Array.from({length:32},(_,i)=>`<div style="background-image:url('${svgPoster('',i)}')"></div>`).join('');
  enter();
})();
</script>
</body>
