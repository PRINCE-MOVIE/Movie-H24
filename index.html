<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<title>PRINCE MOVIE — Animés & K-Dramas en streaming</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0a0a; --bg-2: #171717; --card: #1e1e1e;
  --accent: #e50914; --accent-2: #6b0710;
  --text: #f2f2f2; --text-muted: #9b9b9b;
}
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; }
header { background: var(--bg); padding: 16px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; transition: .2s; }
header.transparent-header { background: linear-gradient(180deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,0) 100%); border-bottom-color: transparent; }
.logo { display: inline-flex; align-items: center; gap: 9px; font-size: 24px; font-weight: 900; letter-spacing: 1.5px; color: #fff; cursor: pointer; text-decoration: none; background: none; border: none; }
.logo-mark { flex-shrink: 0; }
nav { display: flex; gap: 16px; flex-wrap: wrap; }
nav a { color: var(--text-muted); text-decoration: none; font-weight: 600; padding: 6px 12px; border-radius: 6px; transition: .2s; }
nav a:hover, nav a.active { color: var(--accent); background: rgba(229, 9, 20, 0.1); }
.search-box { margin-left: auto; display: flex; gap: 8px; }
.search-box input { background: var(--bg-2); border: 1px solid #333; color: var(--text); padding: 8px 14px; border-radius: 6px; outline: none; width: 220px; }
.search-box input:focus { border-color: var(--accent); }
.search-box button { background: var(--accent); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; }
main { padding: 24px; max-width: 1400px; margin: 0 auto; }
h1.section-title { font-size: 24px; margin-bottom: 20px; border-left: 4px solid var(--accent); padding-left: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; }
.card { background: var(--card); border-radius: 10px; overflow: hidden; cursor: pointer; transition: .25s; position: relative; text-decoration: none; color: inherit; }
.card:hover { transform: translateY(-5px); box-shadow: 0 8px 24px rgba(226,38,28,.25); }
.card img { width: 100%; height: 240px; object-fit: cover; display: block; background: #222; }
.card .info { padding: 10px; }
.card .info strong { display: block; font-size: 14px; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-ep-tag { position: absolute; right: 8px; bottom: 8px; z-index: 4; font-size: 10px; padding: 2px 8px; }
.card-date { position: absolute; left: 8px; bottom: 8px; z-index: 4; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,.65); color: #fff; }
.has-chips { padding-top: 14px; }
.chip-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 14px; margin-bottom: 8px; }
.chip { flex: 0 0 auto; background: var(--card); border: 1px solid #2a2a2a; color: var(--text-muted); padding: 9px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.badge { display: inline-block; background: var(--accent); color: #000; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
.badge.vostfr { background: #06c; color: #fff; }
.badge.truefrench { background: #0a7; color: #fff; }
.detail { display: flex; gap: 30px; flex-wrap: wrap; margin-bottom: 40px; }
.detail img.poster { width: 260px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
.detail .meta { flex: 1; min-width: 280px; }
.detail h1 { font-size: 32px; margin-bottom: 12px; }
.detail .tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.tag { background: var(--bg-2); padding: 4px 10px; border-radius: 20px; font-size: 12px; color: var(--text-muted); border: 1px solid #333; }
.synopsis { line-height: 1.7; color: #ccc; margin: 16px 0; }
.btn { display: inline-block; background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #000; padding: 12px 24px; border-radius: 8px; font-weight: 800; text-decoration: none; border: none; cursor: pointer; }
.btn:hover { transform: scale(1.05); }
.episodes-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 20px; }
.episode-item { background: var(--bg-2); padding: 12px 16px; border-radius: 8px; border: 1px solid #2a2a35; cursor: pointer; transition: .2s; color: var(--text); text-decoration: none; display: block; }
.episode-item:hover { border-color: var(--accent); background: var(--card); }
.episode-item .saison { font-size: 11px; color: var(--accent); font-weight: 700; }
.player-wrap { width: 100%; max-width: 1100px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
.player-wrap iframe { width: 100%; height: 100%; border: none; }
.servers-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px auto; max-width: 1100px; justify-content: center; }
.server-btn { background: var(--bg-2); border: 1px solid #333; color: var(--text); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: .2s; }
.server-btn:hover, .server-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
.error-box { text-align: center; padding: 80px 20px; max-width: 500px; margin: 0 auto; }
.error-icon { color: var(--accent); margin-bottom: 14px; }
.error-icon svg { width: 40px; height: 40px; }
.error-box h2 { font-size: 26px; margin-bottom: 12px; color: var(--text); }
.error-box p { color: var(--text-muted); margin-bottom: 24px; }
.pagination { display: flex; justify-content: center; gap: 10px; margin: 30px 0; flex-wrap: wrap; }
.pagination button { background: var(--bg-2); border: 1px solid #333; color: var(--text); padding: 8px 16px; border-radius: 6px; cursor: pointer; }
.pagination button:disabled { opacity: .3; cursor: not-allowed; }
.pagination button.active { background: var(--accent); color: #000; font-weight: 700; }
.retry-banner { position: fixed; top: 0; left: 0; right: 0; z-index: 999; display: flex; align-items: center; justify-content: center; gap: 16px; padding: 10px 16px; background: var(--accent); color: #000; font-weight: 700; }
.retry-banner button { background: #fff; color: var(--accent); border: none; border-radius: 4px; padding: 4px 12px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
.retry-banner-msg { display: flex; align-items: center; gap: 8px; }
.retry-banner-msg svg { width: 18px; height: 18px; flex-shrink: 0; }
.loader { text-align: center; padding: 60px; color: var(--accent); font-size: 18px; }
.loader::after { content: ""; display: inline-block; width: 20px; height: 20px; border: 3px solid var(--accent); border-top-color: transparent; border-radius: 50%; margin-left: 10px; vertical-align: middle; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.account-menu { display: flex; align-items: center; gap: 14px; margin-left: auto; position: relative; }
.account-link { color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 14px; }
.account-link:hover { color: var(--accent); }
.account-btn-signup { padding: 8px 16px; font-size: 14px; }
.account-avatar { width: 38px; height: 38px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #000; border: none; font-weight: 900; font-size: 16px; }
.account-dropdown { position: absolute; top: 48px; right: 0; background: var(--card); border: 1px solid #2a2a35; border-radius: 10px; min-width: 200px; padding: 8px; display: none; flex-direction: column; }
.account-dropdown.open { display: flex; }
.account-dropdown-name { padding: 8px 10px 2px; font-weight: 700; }
.account-dropdown-sub { padding: 0 10px 6px; font-size: 12px; color: var(--text-muted); }
.account-dropdown a, .account-dropdown button { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text); text-decoration: none; padding: 10px; border-radius: 8px; cursor: pointer; }
.account-dropdown a:hover, .account-dropdown button:hover { background: rgba(226,38,28,.12); color: var(--accent); }
.hero { position: relative; height: 78vh; min-height: 420px; display: flex; align-items: flex-end; padding: 60px 40px; margin: -1px -24px 40px; background-size: cover; background-position: center; }
.hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,15,.2) 0%, rgba(10,10,15,.5) 55%, var(--bg) 97%), linear-gradient(90deg, rgba(10,10,15,.9) 0%, rgba(10,10,15,.25) 55%, rgba(10,10,15,.1) 100%); }
.hero-content { position: relative; max-width: 560px; }
.hero-content h1 { font-size: 42px; font-weight: 900; margin-bottom: 14px; text-shadow: 0 4px 20px rgba(0,0,0,.6); }
.hero-badges { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.hero-content p { color: #eee; line-height: 1.6; margin-bottom: 22px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
.hero-actions { display: flex; gap: 14px; flex-wrap: wrap; }
.btn-outline { display: inline-block; background: rgba(120,120,130,.4); color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: 800; text-decoration: none; border: none; cursor: pointer; }
.btn-outline:hover { background: rgba(120,120,130,.6); }
.rows-wrap { padding: 0 16px; }
.row-block { margin-bottom: 38px; }
.row-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 8px; margin-bottom: 14px; }
.row-head h2 { font-size: 20px; border-left: 4px solid var(--accent); padding-left: 12px; }
.row-head a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 600; cursor: pointer; }
.row-head a:hover { color: var(--accent); }
.row-scroll { display: flex; gap: 14px; overflow-x: auto; padding: 4px 8px 14px; scroll-behavior: smooth; }
.row-scroll::-webkit-scrollbar { height: 8px; }
.row-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 8px; }
.row-scroll::-webkit-scrollbar-track { background: transparent; }
.row-card { flex: 0 0 auto; width: 160px; background: var(--card); border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit; transition: .25s; position: relative; }
.mylist-heart { position: absolute; top: 8px; right: 8px; z-index: 5; width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(10,10,10,.7); color: #fff; font-size: 16px; cursor: pointer; }
.mylist-heart.active { color: var(--accent); }
.mylist-heart:hover { background: rgba(10,10,10,.9); }
.row-card:hover { transform: translateY(-5px) scale(1.03); box-shadow: 0 8px 24px rgba(226,38,28,.25); }
.row-card img { width: 100%; height: 230px; object-fit: cover; display: block; background: #222; }
.row-card-badge { position: absolute; left: 8px; bottom: 8px; z-index: 4; }
.auth-wrap { max-width: 440px; margin: 60px auto; background: var(--card); border-radius: 14px; padding: 40px 32px; border: 1px solid #2a2a35; }
.auth-wrap h1 { font-size: 26px; margin-bottom: 6px; }
.auth-wrap .sub { color: var(--text-muted); font-size: 14px; margin-bottom: 26px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
.field input, .field select { width: 100%; background: var(--bg-2); border: 1px solid #333; color: var(--text); padding: 12px 14px; border-radius: 8px; outline: none; font-size: 14px; }
.field input:focus, .field select:focus { border-color: var(--accent); }
.field-row { display: flex; gap: 12px; }
.field-row .field { flex: 1; }
.field-error { color: #ff5c5c; font-size: 12px; margin-top: 6px; display: none; }
.field.invalid input { border-color: #ff5c5c; }
.field.invalid .field-error { display: block; }
.auth-submit { width: 100%; margin-top: 8px; }
.auth-switch { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); }
.auth-switch a { color: var(--accent); text-decoration: none; font-weight: 700; cursor: pointer; }
.notice-banner { background: rgba(226,38,28,.12); border: 1px solid rgba(226,38,28,.3); color: var(--accent); padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 22px; line-height: 1.5; }
.settings-section { background: var(--card); border: 1px solid #2a2a35; border-radius: 12px; padding: 26px 28px; margin-bottom: 24px; max-width: 640px; }
.settings-section h2 { font-size: 18px; margin-bottom: 18px; border-left: 4px solid var(--accent); padding-left: 12px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #2a2a35; }
.toggle-row:last-child { border-bottom: none; }
.toggle-row .label { font-size: 14px; }
.toggle-row .label small { display: block; color: var(--text-muted); font-size: 12px; margin-top: 2px; }
.switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider { position: absolute; inset: 0; background: #333; border-radius: 24px; cursor: pointer; transition: .2s; }
.switch .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::before { transform: translateX(20px); }
.save-confirm { color: #0a7; font-size: 13px; margin-top: 10px; display: none; font-weight: 700; }
.welcome-body { padding-bottom: 0; }
.welcome-bg { position: fixed; inset: 0; z-index: -2; display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; overflow: hidden; }
.welcome-bg img { width: 100%; height: 100%; object-fit: cover; opacity: .55; filter: saturate(1.1); }
.welcome-overlay { position: fixed; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(10,10,10,.75) 0%, rgba(10,10,10,.9) 55%, var(--bg) 100%), linear-gradient(90deg, rgba(10,10,10,.3) 0%, rgba(10,10,10,.1) 100%); }
.welcome-header { display: flex; align-items: center; justify-content: space-between; padding: 22px 40px; }
.logo-lg { font-size: 22px; }
.welcome-login-btn { padding: 9px 22px; font-size: 14px; }
.welcome-credit { position: relative; z-index: 2; text-align: center; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: 2px; margin-top: -6px; margin-bottom: 6px; }
.welcome-hero { text-align: center; max-width: 720px; margin: 0 auto; padding: 90px 24px 70px; }
.welcome-hero h1 { font-size: 48px; font-weight: 900; line-height: 1.15; margin-bottom: 20px; letter-spacing: -1px; text-shadow: 0 6px 30px rgba(0,0,0,.5); }
.welcome-sub { font-size: 19px; color: #d8d8d8; line-height: 1.65; margin-bottom: 36px; max-width: 560px; margin-left: auto; margin-right: auto; }
.welcome-form { display: flex; gap: 10px; max-width: 560px; margin: 0 auto 14px; flex-wrap: wrap; justify-content: center; }
.welcome-form input { flex: 1; min-width: 220px; background: rgba(23,23,23,.85); border: 1px solid #3a3a3a; color: var(--text); padding: 15px 18px; border-radius: 8px; outline: none; font-size: 16px; }
.welcome-form input:focus { border-color: var(--accent); }
.welcome-cta { font-size: 17px; padding: 15px 28px; white-space: nowrap; }
.welcome-note { color: var(--text-muted); font-size: 14px; }
.welcome-note a { color: var(--accent); text-decoration: none; font-weight: 700; cursor: pointer; }
.welcome-features { position: relative; max-width: 1000px; margin: 0 auto; padding: 50px 24px 70px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; border-top: 1px solid #201414; }
.feature { text-align: center; padding: 10px; }
.feature-icon { width: 58px; height: 58px; margin: 0 auto 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(226,38,28,.25), rgba(226,38,28,.06)); border: 1px solid rgba(226,38,28,.25); }
.feature-icon svg { width: 26px; height: 26px; }
.feature h3 { font-size: 17px; margin-bottom: 8px; font-weight: 800; }
.feature p { color: var(--text-muted); font-size: 14px; line-height: 1.65; }
.welcome-footer { text-align: center; padding: 28px 20px; color: #666; font-size: 12px; border-top: 1px solid #1a1a1a; }
@media (max-width: 700px) {
  .hero { height: 60vh; padding: 30px 20px; margin: -1px -16px 24px; }
  .hero-content h1 { font-size: 28px; }
  .row-card { width: 128px; }
  .row-card img { height: 185px; }
  .auth-wrap { margin: 30px 16px; padding: 28px 20px; }
  .field-row { flex-direction: column; gap: 0; }
  .welcome-header { padding: 16px 20px; }
  .welcome-hero h1 { font-size: 30px; }
  .welcome-sub { font-size: 15px; }
  .welcome-features { grid-template-columns: 1fr; }
  .welcome-form { flex-direction: column; }
  .welcome-bg { grid-template-columns: repeat(3, 1fr); }
  header { padding: 12px; }
  .logo { font-size: 20px; }
  .search-box { width: 100%; margin-left: 0; }
  .search-box input { width: 100%; }
  main { padding: 16px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .card img { height: 190px; }
  .detail h1 { font-size: 24px; }
  .detail img.poster { width: 100%; max-width: 260px; margin: 0 auto; }
}
.back-btn { background: var(--bg-2); border: 1px solid #333; color: var(--text); width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.back-btn svg { width: 20px; height: 20px; }
.back-btn:hover { border-color: var(--accent); color: var(--accent); }
.search-hero { padding: 10px 0 24px; }
.search-box-lg { max-width: 560px; margin: 0 auto; background: var(--card); border: 1px solid #2a2a2a; border-radius: 10px; padding: 4px 16px; display: flex; align-items: center; gap: 10px; }
.search-box-lg .search-icon { color: var(--text-muted); display: flex; }
.search-box-lg input { flex: 1; background: none; border: none; color: var(--text); padding: 14px 0; outline: none; font-size: 15px; }
.card, .row-card { overflow: hidden; }
.card a, .row-card a { position: relative; display: block; }
.card a::after, .row-card a::after { content: "▶"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; background: rgba(10,10,10,.2); opacity: 0; transition: .2s; }
.card:hover a::after, .row-card:hover a::after { opacity: 1; }
.has-bottom-nav { padding-bottom: 78px; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 600; display: flex; background: rgba(10,10,10,.97); border-top: 1px solid #222; padding: 8px 4px calc(8px + env(safe-area-inset-bottom)); }
.bottom-nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #7a7a7a; text-decoration: none; font-size: 10.5px; font-weight: 600; padding: 4px 0; cursor: pointer; }
.bottom-nav a svg { width: 22px; height: 22px; }
.bottom-nav a.active { color: var(--accent); }
.bottom-nav a.active svg { stroke: var(--accent); }
.search-box button svg, .search-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="pmLogoGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#e0102a"/>
      <stop offset="55%" stop-color="#6e0a17"/>
      <stop offset="100%" stop-color="#1c0306"/>
    </linearGradient>
    <radialGradient id="pmLogoShine" cx="28%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pmLogoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d78b"/>
      <stop offset="100%" stop-color="#d9a13c"/>
    </linearGradient>
    <symbol id="pmLogoMark" viewBox="0 0 200 200">
      <rect width="200" height="200" rx="46" fill="url(#pmLogoGrad)"/>
      <rect width="200" height="200" rx="46" fill="url(#pmLogoShine)"/>
      <rect width="200" height="200" rx="46" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
      <rect x="58" y="46" width="24" height="128" rx="10" fill="url(#pmLogoGold)"/>
      <path d="M82,50 L148,88 L82,126 Z" fill="url(#pmLogoGold)"/>
    </symbol>
  </defs>
</svg>

<header id="siteHeader"></header>
<div id="announce"></div>
<div id="hero"></div>
<div id="app"><div class="loader">Chargement</div></div>

<script>
window.open = function (url) { console.warn("Pop-up bloqué :", url); return null; };

const PLAYER_SERVERS = [
  { name: "Serveur 1", url: "https://example.com/embed/1" },
  { name: "Serveur 2", url: "https://example.com/embed/2" },
  { name: "Serveur 3", url: "https://example.com/embed/3" },
  { name: "Serveur 4", url: "https://example.com/embed/4" },
  { name: "Serveur 5", url: "https://example.com/embed/5" }
];

function ensureServerTabs() {
  const playerWrap = document.querySelector('.player-wrap');
  if (!playerWrap) return;

  const iframe = playerWrap.querySelector('iframe');
  if (!iframe) return;

  let tabs = document.querySelector('.servers-tabs');
  if (!tabs) {
    tabs = document.createElement('div');
    tabs.className = 'servers-tabs';
    playerWrap.parentNode.insertBefore(tabs, playerWrap.nextSibling);
  }

  if (tabs.dataset.bound === 'true') return;
  tabs.dataset.bound = 'true';

  tabs.innerHTML = '';
  PLAYER_SERVERS.forEach((server, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'server-btn' + (index === 0 ? ' active' : '');
    button.textContent = server.name;
    button.addEventListener('click', () => {
      document.querySelectorAll('.server-btn').forEach((btn) => btn.classList.toggle('active', btn === button));
      iframe.src = server.url;
    });
    tabs.appendChild(button);
  });
}

const originalAddEventListener = window.addEventListener.bind(window);
window.addEventListener = function (type, listener, options) {
  originalAddEventListener(type, listener, options);
  if (type === 'load') {
    setTimeout(ensureServerTabs, 300);
  }
};

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(ensureServerTabs, 200);
  const observer = new MutationObserver(() => ensureServerTabs());
  observer.observe(document.body, { childList: true, subtree: true });
});

const API_BASE = "http://51.75.118.170:20041/api/v1";
const MY_PROXY_URL = "/api/proxy?url=";
const PROXIES = [MY_PROXY_URL, "https://api.allorigins.win/raw?url=", "https://corsproxy.io/?url=", "https://api.codetabs.com/v1/proxy?quest=", "https://api.cors.lol/?url="];

function orderedProxies() {
  let lastGoodIdx = -1;
  try { lastGoodIdx = Number(sessionStorage.getItem("pm_last_proxy_idx")); } catch (e) {}
  const all = PROXIES.map((p, i) => [p, i]);
  if (!Number.isInteger(lastGoodIdx) || lastGoodIdx <= 0 || lastGoodIdx >= PROXIES.length) return all;
  return [all[0], all[lastGoodIdx], ...all.filter(([, i]) => i !== 0 && i !== lastGoodIdx)];
}

const CACHE_TTL_MS = 10 * 60 * 1000;
const memCache = new Map();

function cacheRead(key) {
  const now = Date.now();
  const mem = memCache.get(key);
  if (mem && now - mem.t < CACHE_TTL_MS) return mem.v;
  try {
    const raw = sessionStorage.getItem("pm_cache:" + key);
    if (!raw) return null;
    const { t, v } = JSON.parse(raw);
    if (now - t >= CACHE_TTL_MS) return null;
    memCache.set(key, { t, v });
    return v;
  } catch (e) { return null; }
}
function cacheWrite(key, v) {
  const entry = { t: Date.now(), v };
  memCache.set(key, entry);
  try { sessionStorage.setItem("pm_cache:" + key, JSON.stringify(entry)); } catch (e) {}
  try { localStorage.setItem("pm_lastgood:" + key, JSON.stringify(v)); } catch (e) {}
}
function cacheReadLastGood(key) {
  try {
    const raw = localStorage.getItem("pm_lastgood:" + key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

class Semaphore {
  constructor(max) { this.max = max; this.count = 0; this.queue = []; }
  acquire() {
    return new Promise(resolve => {
      const tryAcquire = () => {
        if (this.count < this.max) { this.count++; resolve(() => this.release()); }
        else this.queue.push(tryAcquire);
      };
      tryAcquire();
    });
  }
  release() { this.count--; const next = this.queue.shift(); if (next) next(); }
}
const proxySemaphore = new Semaphore(4);

const isEmptyList = (j) => !!j && Array.isArray(j.data) && j.data.length === 0;
const pendingReq = new Map();
function apiRaw(path, params = {}) {
  const u = new URL(API_BASE + path);
  Object.entries(params).forEach(([k, v]) => { if (v !== null && v !== undefined && v !== "") u.searchParams.set(k, v); });
  const key = u.toString();
  if (pendingReq.has(key)) return pendingReq.get(key);
  const p = apiRawCore(path, params);
  pendingReq.set(key, p);
  const done = () => { if (pendingReq.get(key) === p) pendingReq.delete(key); };
  p.then(done, done);
  return p;
}
async function apiRawCore(path, params = {}) {
  const url = new URL(API_BASE + path);
  Object.entries(params).forEach(([k, v]) => {
    if (v !== null && v !== undefined && v !== "") url.searchParams.set(k, v);
  });
  const urlStr = url.toString();
  const cacheKey = urlStr;
  const cached = cacheRead(cacheKey);
  if (cached && !isEmptyList(cached)) return cached;

  const directController = new AbortController();
  const directTimer = setTimeout(() => directController.abort(), 9000);
  const directAttempt = fetch(urlStr, { signal: directController.signal })
    .then(async (res) => {
      let json;
      try { json = await res.json(); }
      catch (e) { throw new Error("Réponse invalide de l'API."); }
      if (json && json.success === false) {
        const err = new Error(json.error?.message || "Erreur inconnue.");
        err.code = json.error?.code;
        throw err;
      }
      return json;
    })
    .finally(() => clearTimeout(directTimer));

  const orderedList = orderedProxies();
  const controllers = orderedList.map(() => new AbortController());
  const attempts = orderedList.map(([proxy, i], orderIdx) => (async () => {
    const isInternal = proxy === MY_PROXY_URL;
    if (!isInternal) {
      await new Promise((resolve) => {
        const w = setTimeout(resolve, 3000);
        controllers[orderIdx].signal.addEventListener("abort", () => { clearTimeout(w); });
      });
    }
    const release = isInternal ? () => {} : await proxySemaphore.acquire();
    const timer = setTimeout(() => controllers[orderIdx].abort(), isInternal ? 25000 : 9000);
    try {
      const res = await fetch(proxy + encodeURIComponent(urlStr), { signal: controllers[orderIdx].signal });
      let json;
      try { json = await res.json(); }
      catch (e) { throw new Error("Réponse invalide du proxy."); }
      if (!json || json.success === false) {
        const err = new Error(json?.error?.message || "Erreur inconnue.");
        err.code = json?.error?.code;
        throw err;
      }
      return json;
    } catch (e) {
      throw e;
    } finally {
      clearTimeout(timer);
      if (!isInternal) release();
    }
  })());

  try {
    const result = await Promise.any([directAttempt, ...attempts]);
    cacheWrite(cacheKey, result);
    return result;
  } catch (e) {
    const lastGood = cacheReadLastGood(cacheKey);
    if (lastGood) return lastGood;
    throw e;
  }
}
</script>
</body>
</html>
